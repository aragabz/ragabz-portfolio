<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
  <title id="t">Access and refresh token lifetimes with rotation</title>
  <desc id="d">Access tokens live for 15 minutes each and are renewed with a refresh token. Each refresh issues a new refresh token. Reuse of an old refresh token revokes the whole family.</desc>
  <rect width="800" height="420" rx="16" fill="#0d1117"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="32" y="44" fill="#e6edf3" font-size="18" font-weight="600">Short access tokens, rotating refresh tokens</text>
    <text x="32" y="68" fill="#8b949e" font-size="13">Access tokens are cheap to verify but hard to revoke, so they expire fast. Refresh tokens are revocable.</text>
  </g>
  <!-- time axis -->
  <line x1="140" y1="330" x2="770" y2="330" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b949e">
    <text x="132" y="352">0</text>
    <text x="270" y="352">15m</text>
    <text x="410" y="352">30m</text>
    <text x="550" y="352">45m</text>
    <text x="690" y="352">60m</text>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="14" fill="#e6edf3">
    <text x="32" y="128">Access</text>
    <text x="32" y="198">Refresh</text>
    <text x="32" y="268">Attacker</text>
  </g>
  <!-- access tokens -->
  <rect x="140" y="108" width="136" height="30" rx="6" fill="#79c0ff" fill-opacity="0.18" stroke="#79c0ff"/>
  <rect x="280" y="108" width="136" height="30" rx="6" fill="#79c0ff" fill-opacity="0.18" stroke="#79c0ff"/>
  <rect x="420" y="108" width="136" height="30" rx="6" fill="#79c0ff" fill-opacity="0.18" stroke="#79c0ff"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e6edf3">
    <text x="190" y="128">AT1</text>
    <text x="330" y="128">AT2</text>
    <text x="470" y="128">AT3</text>
  </g>
  <!-- refresh tokens -->
  <rect x="140" y="178" width="136" height="30" rx="6" fill="#7ee787" fill-opacity="0.15" stroke="#7ee787"/>
  <rect x="280" y="178" width="136" height="30" rx="6" fill="#7ee787" fill-opacity="0.15" stroke="#7ee787"/>
  <rect x="420" y="178" width="136" height="30" rx="6" fill="#7ee787" fill-opacity="0.15" stroke="#7ee787"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e6edf3">
    <text x="190" y="198">RT1</text>
    <text x="330" y="198">RT2</text>
    <text x="470" y="198">RT3</text>
  </g>
  <!-- rotation arrows -->
  <g stroke="#8b949e" stroke-width="1.5" fill="none">
    <path d="M278 176 V150"/>
    <path d="M418 176 V150"/>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b949e">
    <text x="286" y="166">refresh</text>
    <text x="426" y="166">refresh</text>
  </g>
  <!-- attacker reuse -->
  <rect x="570" y="248" width="40" height="30" rx="6" fill="#f78166" fill-opacity="0.18" stroke="#f78166"/>
  <text x="577" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e6edf3">RT2</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="13">
    <text x="620" y="260" fill="#f78166">Stolen RT2 replayed:</text>
    <text x="620" y="280" fill="#f78166">already used, so</text>
    <text x="620" y="300" fill="#f78166">revoke RT3 and family</text>
  </g>
  <line x1="566" y1="100" x2="566" y2="330" stroke="#f78166" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b949e">
    <text x="32" y="388">A stolen access token works only until exp (minutes). A replayed refresh token is detected.</text>
  </g>
</svg>
