  <line x1="314" y1="156" x2="314" y2="194" stroke="#f78166" stroke-width="1.2" stroke-opacity="0.8"/>
  <rect x="308" y="196" width="12" height="16" rx="2" fill="#f78166" fill-opacity="0.85"/>
  <line x1="338" y1="134" x2="338" y2="154" stroke="#79c0ff" stroke-width="2"/>
  <line x1="338" y1="156" x2="338" y2="194" stroke="#f78166" stroke-width="1.2" stroke-opacity="0.8"/>
  <rect x="332" y="196" width="12" height="16" rx="2" fill="#f78166" fill-opacity="0.85"/>
  <line x1="362" y1="134" x2="362" y2="154" stroke="#79c0ff" stroke-width="2"/>
  <line x1="362" y1="156" x2="362" y2="194" stroke="#f78166" stroke-width="1.2" stroke-opacity="0.8"/>
  <rect x="356" y="196" width="12" height="16" rx="2" fill="#f78166" fill-opacity="0.85"/>
