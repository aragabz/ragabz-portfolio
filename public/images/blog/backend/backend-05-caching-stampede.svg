  <line x1="386" y1="156" x2="386" y2="194" stroke="#f78166" stroke-width="1.2" stroke-opacity="0.8"/>
  <rect x="380" y="196" width="12" height="16" rx="2" fill="#f78166" fill-opacity="0.85"/>
  <line x1="410" y1="134" x2="410" y2="154" stroke="#79c0ff" stroke-width="2"/>
  <line x1="410" y1="156" x2="410" y2="194" stroke="#f78166" stroke-width="1.2" stroke-opacity="0.8"/>
