  <line x1="242" y1="156" x2="242" y2="194" stroke="#f78166" stroke-width="1.2" stroke-opacity="0.8"/>
  <rect x="236" y="196" width="12" height="16" rx="2" fill="#f78166" fill-opacity="0.85"/>
