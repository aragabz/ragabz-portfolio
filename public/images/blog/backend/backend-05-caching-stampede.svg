<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cache stampede versus request coalescing</title>
  <desc id="d">Top: when a hot key expires, every concurrent request misses and queries the database. Bottom: with coalescing, one request recomputes while the rest get the stale value or wait, so the database sees one query.</desc>
  <rect width="800" height="480" rx="16" fill="#0d1117"/>
  <text x="32" y="44" fill="#e6edf3" font-size="18" font-weight="600" font-family="Inter, system-ui, sans-serif">A hot key expires at 12:00:00.000</text>
  <text x="32" y="68" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">Same traffic, two outcomes. Each tick is one request arriving in the next 50 ms.</text>
  <text x="32" y="110" fill="#f78166" font-size="15" font-weight="600" font-family="Inter, system-ui, sans-serif">Without protection: every miss goes to the database</text>
  <text x="32" y="148" fill="#e6edf3" font-size="13" font-family="Inter, system-ui, sans-serif">Requests</text>
  <text x="32" y="208" fill="#e6edf3" font-size="13" font-family="Inter, system-ui, sans-serif">Database</text>
  <line x1="130" y1="144" x2="770" y2="144" stroke="#30363d" stroke-width="2"/>
  <line x1="130" y1="204" x2="770" y2="204" stroke="#30363d" stroke-width="2"/>
  <line x1="150" y1="124" x2="150" y2="220" stroke="#f78166" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="156" y="126" fill="#f78166" font-size="13" font-family="Inter, system-ui, sans-serif">expiry</text>
  <line x1="170" y1="134" x2="170" y2="154" stroke="#79c0ff" stroke-width="2"/>
  <line x1="170" y1="156" x2="170" y2="194" stroke="#f78166" stroke-width="1.2" stroke-opacity="0.8"/>
  <rect x="164" y="196" width="12" height="16" rx="2" fill="#f78166" fill-opacity="0.85"/>
  <line x1="194" y1="134" x2="194" y2="154" stroke="#79c0ff" stroke-width="2"/>
  <line x1="194" y1="156" x2="194" y2="194" stroke="#f78166" stroke-width="1.2" stroke-opacity="0.8"/>
  <rect x="188" y="196" width="12" height="16" rx="2" fill="#f78166" fill-opacity="0.85"/>
