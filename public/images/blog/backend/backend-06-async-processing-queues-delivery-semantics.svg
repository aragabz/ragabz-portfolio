<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d">
  <title id="t">Where the ack goes decides the delivery guarantee</title>
  <desc id="d">At-most-once: the consumer acks, then crashes while processing, and the message is lost. At-least-once: the consumer processes, crashes before acking, the broker redelivers and the work runs twice.</desc>
  <rect width="800" height="460" rx="16" fill="#0d1117"/>
  <text x="32" y="44" fill="#e6edf3" font-size="18" font-weight="600" font-family="Inter, system-ui, sans-serif">Where the ack goes decides the guarantee</text>
  <text x="32" y="68" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">Same crash, different outcome. Time flows left to right.</text>
  <text x="32" y="112" fill="#f78166" font-size="15" font-weight="600" font-family="Inter, system-ui, sans-serif">At-most-once: ack, then process</text>
  <rect x="32" y="128" width="110" height="34" rx="8" fill="#79c0ff" fill-opacity="0.16" stroke="#79c0ff"/>
  <text x="87" y="150" fill="#e6edf3" font-size="13" text-anchor="middle" font-family="Inter, system-ui, sans-serif">receive M1</text>
  <line x1="142" y1="145" x2="164" y2="145" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M164 140 L170 145 L164 150 Z" fill="#8b949e"/>
  <rect x="170" y="128" width="90" height="34" rx="8" fill="#d2a8ff" fill-opacity="0.16" stroke="#d2a8ff"/>
  <text x="215" y="150" fill="#e6edf3" font-size="13" text-anchor="middle" font-family="Inter, system-ui, sans-serif">ack M1</text>
  <line x1="260" y1="145" x2="282" y2="145" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M282 140 L288 145 L282 150 Z" fill="#8b949e"/>
  <rect x="288" y="128" width="150" height="34" rx="8" fill="#79c0ff" fill-opacity="0.16" stroke="#79c0ff"/>
  <text x="363" y="150" fill="#e6edf3" font-size="13" text-anchor="middle" font-family="Inter, system-ui, sans-serif">process M1...</text>
  <path d="M451 136 L469 154 M469 136 L451 154" stroke="#f78166" stroke-width="3"/>
  <text x="480" y="141" fill="#f78166" font-size="13" font-family="Inter, system-ui, sans-serif">crash</text>
  <text x="480" y="159" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">broker already deleted M1</text>
  <text x="32" y="196" font-size="13" font-family="Inter, system-ui, sans-serif"><tspan fill="#e6edf3">Result: M1 is </tspan><tspan fill="#f78166" font-weight="600">lost</tspan><tspan fill="#8b949e">. Never duplicated. Fine for telemetry, wrong for orders.</tspan></text>
  <line x1="32" y1="222" x2="768" y2="222" stroke="#30363d" stroke-width="1"/>
  <text x="32" y="256" fill="#7ee787" font-size="15" font-weight="600" font-family="Inter, system-ui, sans-serif">At-least-once: process, then ack</text>
  <rect x="32" y="272" width="110" height="34" rx="8" fill="#79c0ff" fill-opacity="0.16" stroke="#79c0ff"/>
  <text x="87" y="294" fill="#e6edf3" font-size="13" text-anchor="middle" font-family="Inter, system-ui, sans-serif">receive M1</text>
  <line x1="142" y1="289" x2="164" y2="289" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M164 284 L170 289 L164 294 Z" fill="#8b949e"/>
  <rect x="170" y="272" width="140" height="34" rx="8" fill="#79c0ff" fill-opacity="0.16" stroke="#79c0ff"/>
  <text x="240" y="294" fill="#e6edf3" font-size="13" text-anchor="middle" font-family="Inter, system-ui, sans-serif">process M1 (done)</text>
  <path d="M323 280 L341 298 M341 280 L323 298" stroke="#f78166" stroke-width="3"/>
  <text x="350" y="285" fill="#f78166" font-size="13" font-family="Inter, system-ui, sans-serif">crash</text>
  <text x="350" y="303" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">before ack</text>
  <path d="M440 289 C 470 289, 470 345, 500 345" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="400" y="340" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">redelivered</text>
  <rect x="500" y="328" width="140" height="34" rx="8" fill="#f78166" fill-opacity="0.16" stroke="#f78166"/>
  <text x="570" y="350" fill="#e6edf3" font-size="13" text-anchor="middle" font-family="Inter, system-ui, sans-serif">process M1 again</text>
  <line x1="640" y1="345" x2="654" y2="345" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M654 340 L660 345 L654 350 Z" fill="#8b949e"/>
  <rect x="660" y="328" width="100" height="34" rx="8" fill="#d2a8ff" fill-opacity="0.16" stroke="#d2a8ff"/>
  <text x="710" y="350" fill="#e6edf3" font-size="13" text-anchor="middle" font-family="Inter, system-ui, sans-serif">ack M1</text>
  <text x="32" y="402" font-size="13" font-family="Inter, system-ui, sans-serif"><tspan fill="#e6edf3">Result: nothing lost, but the work ran </tspan><tspan fill="#f78166" font-weight="600">twice</tspan><tspan fill="#8b949e">. The consumer must be idempotent.</tspan></text>
  <text x="32" y="432" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">practical default = at-least-once delivery + idempotent consumer</text>
</svg>
