<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 486" role="img" aria-labelledby="t d">
<title id="t">Error budget burn-down over a 30-day window</title>
<desc id="d">Remaining error budget from 100 percent to 0 over 30 days. A steady burn rate of 1 reaches zero exactly on day 30. An incident on day 9 burns at 14.4 times the sustainable rate, triggering a page, and leaves the budget on track to run out around day 23, which triggers the error budget policy.</desc>
<rect x="0" y="0" width="800" height="486" rx="16" fill="#0d1117"/>
<g font-family="Inter, system-ui, sans-serif">
<text x="32" y="44" fill="#e6edf3" font-size="18" font-weight="600">Error budget burn-down, 99.9% SLO, 30-day window</text>
<text x="32" y="68" fill="#8b949e" font-size="13">Budget = 0.1% of requests. Burn rate 1 spends exactly the whole budget by day 30.</text>
<line x1="96" y1="392.0" x2="744" y2="392.0" stroke="#30363d" stroke-width="1"/>
<text x="86" y="396.0" fill="#8b949e" font-size="13" text-anchor="end">0%</text>
<line x1="96" y1="318.0" x2="744" y2="318.0" stroke="#30363d" stroke-width="1"/>
<text x="86" y="322.0" fill="#8b949e" font-size="13" text-anchor="end">25%</text>
<line x1="96" y1="244.0" x2="744" y2="244.0" stroke="#30363d" stroke-width="1"/>
<text x="86" y="248.0" fill="#8b949e" font-size="13" text-anchor="end">50%</text>
<line x1="96" y1="170.0" x2="744" y2="170.0" stroke="#30363d" stroke-width="1"/>
<text x="86" y="174.0" fill="#8b949e" font-size="13" text-anchor="end">75%</text>
<line x1="96" y1="96.0" x2="744" y2="96.0" stroke="#30363d" stroke-width="1"/>
<text x="86" y="100.0" fill="#8b949e" font-size="13" text-anchor="end">100%</text>
<text x="96.0" y="414" fill="#8b949e" font-size="13" text-anchor="middle">day 0</text>
<text x="204.0" y="414" fill="#8b949e" font-size="13" text-anchor="middle">day 5</text>
<text x="312.0" y="414" fill="#8b949e" font-size="13" text-anchor="middle">day 10</text>
<text x="420.0" y="414" fill="#8b949e" font-size="13" text-anchor="middle">day 15</text>
<text x="528.0" y="414" fill="#8b949e" font-size="13" text-anchor="middle">day 20</text>
<text x="636.0" y="414" fill="#8b949e" font-size="13" text-anchor="middle">day 25</text>
<text x="744.0" y="414" fill="#8b949e" font-size="13" text-anchor="middle">day 30</text>
<line x1="96.0" y1="96.0" x2="744.0" y2="392.0" stroke="#79c0ff" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="585.2" y="300" fill="#79c0ff" font-size="13">burn rate 1 (sustainable)</text>
<polyline points="96.0,96.0 290.4,184.8 295.8,258.8 587.4,392.0" fill="none" stroke="#f78166" stroke-width="3"/>
<circle cx="290.4" cy="184.8" r="5" fill="#f78166"/>
<text x="400" y="194" fill="#f78166" font-size="13">day 9: incident burns 25% of budget</text>
<text x="400" y="212" fill="#e6edf3" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">14.4x burn: page fires within minutes</text>
<circle cx="587.4" cy="392.0" r="5" fill="#d2a8ff"/>
<text x="560" y="440" fill="#d2a8ff" font-size="13" text-anchor="middle">day 23: budget exhausted, policy kicks in</text>
<text x="32" y="466" fill="#8b949e" font-size="13">Freeze risky releases and fund reliability work until the rolling window recovers.</text>
</g></svg>
