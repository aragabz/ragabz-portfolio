<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
<title id="t">Retries without jitter versus full jitter</title>
<desc id="d">Two timelines of retries from 200 clients that failed at the same moment. Without jitter, every client retries at 100, 300 and 700 milliseconds, producing three tall synchronized spikes. With full jitter, the same retries are spread across the timeline as many short bars.</desc>
<rect x="0" y="0" width="800" height="440" rx="16" fill="#0d1117"/>
<g font-family="Inter, system-ui, sans-serif">
<text x="32" y="44" fill="#e6edf3" font-size="18" font-weight="600">200 clients fail at t = 0 and retry with exponential backoff</text>
<text x="32" y="68" fill="#8b949e" font-size="13">Bar height = retries arriving at the dependency in each 20 ms slot</text>
<text x="32" y="112" fill="#f78166" font-size="15" font-weight="600">No jitter: synchronized waves</text>
<text x="744" y="112" fill="#8b949e" font-size="13" text-anchor="end">each spike = all 200 clients at once</text>
<line x1="96" y1="228" x2="744" y2="228" stroke="#30363d" stroke-width="1.5"/>
<rect x="161.8" y="128.0" width="11.0" height="100.0" rx="2" fill="#f78166"/>
<rect x="291.4" y="128.0" width="11.0" height="100.0" rx="2" fill="#f78166"/>
<rect x="550.6" y="128.0" width="11.0" height="100.0" rx="2" fill="#f78166"/>
<text x="96.0" y="248" fill="#8b949e" font-size="13" text-anchor="middle">0 ms</text>
<text x="258.0" y="248" fill="#8b949e" font-size="13" text-anchor="middle">250 ms</text>
<text x="420.0" y="248" fill="#8b949e" font-size="13" text-anchor="middle">500 ms</text>
<text x="582.0" y="248" fill="#8b949e" font-size="13" text-anchor="middle">750 ms</text>
<text x="744.0" y="248" fill="#8b949e" font-size="13" text-anchor="middle">1000 ms</text>
<text x="32" y="272" fill="#7ee787" font-size="15" font-weight="600">Full jitter: the same retries, spread out</text>
<text x="744" y="272" fill="#8b949e" font-size="13" text-anchor="end">same total retries, peaks about 3x lower</text>
<line x1="96" y1="388" x2="744" y2="388" stroke="#30363d" stroke-width="1.5"/>
<rect x="97.0" y="365.0" width="11.0" height="23.0" rx="2" fill="#7ee787"/>
<rect x="110.0" y="366.5" width="11.0" height="21.5" rx="2" fill="#7ee787"/>
<rect x="122.9" y="359.5" width="11.0" height="28.5" rx="2" fill="#7ee787"/>
<rect x="135.9" y="358.5" width="11.0" height="29.5" rx="2" fill="#7ee787"/>
<rect x="148.8" y="356.0" width="11.0" height="32.0" rx="2" fill="#7ee787"/>
<rect x="161.8" y="375.0" width="11.0" height="13.0" rx="2" fill="#7ee787"/>
<rect x="174.8" y="378.0" width="11.0" height="10.0" rx="2" fill="#7ee787"/>
<rect x="187.7" y="377.0" width="11.0" height="11.0" rx="2" fill="#7ee787"/>
<rect x="200.7" y="373.5" width="11.0" height="14.5" rx="2" fill="#7ee787"/>
<rect x="213.6" y="374.0" width="11.0" height="14.0" rx="2" fill="#7ee787"/>
<rect x="226.6" y="376.5" width="11.0" height="11.5" rx="2" fill="#7ee787"/>
<rect x="239.6" y="378.0" width="11.0" height="10.0" rx="2" fill="#7ee787"/>
<rect x="252.5" y="378.5" width="11.0" height="9.5" rx="2" fill="#7ee787"/>
<rect x="265.5" y="379.0" width="11.0" height="9.0" rx="2" fill="#7ee787"/>
<rect x="278.4" y="382.0" width="11.0" height="6.0" rx="2" fill="#7ee787"/>
<rect x="291.4" y="383.5" width="11.0" height="4.5" rx="2" fill="#7ee787"/>
<rect x="304.4" y="382.0" width="11.0" height="6.0" rx="2" fill="#7ee787"/>
<rect x="317.3" y="384.0" width="11.0" height="4.0" rx="2" fill="#7ee787"/>
<rect x="330.3" y="381.0" width="11.0" height="7.0" rx="2" fill="#7ee787"/>
<rect x="343.2" y="386.0" width="11.0" height="2.0" rx="2" fill="#7ee787"/>
<rect x="356.2" y="381.5" width="11.0" height="6.5" rx="2" fill="#7ee787"/>
<rect x="369.2" y="384.0" width="11.0" height="4.0" rx="2" fill="#7ee787"/>
<rect x="382.1" y="386.0" width="11.0" height="2.0" rx="2" fill="#7ee787"/>
<rect x="395.1" y="385.5" width="11.0" height="2.5" rx="2" fill="#7ee787"/>
<rect x="408.0" y="386.0" width="11.0" height="2.0" rx="2" fill="#7ee787"/>
<rect x="421.0" y="385.5" width="11.0" height="2.5" rx="2" fill="#7ee787"/>
<rect x="434.0" y="384.5" width="11.0" height="3.5" rx="2" fill="#7ee787"/>
<rect x="446.9" y="386.0" width="11.0" height="2.0" rx="2" fill="#7ee787"/>
<rect x="459.9" y="385.5" width="11.0" height="2.5" rx="2" fill="#7ee787"/>
<rect x="472.8" y="384.0" width="11.0" height="4.0" rx="2" fill="#7ee787"/>
<rect x="485.8" y="386.0" width="11.0" height="2.0" rx="2" fill="#7ee787"/>
<rect x="498.8" y="386.0" width="11.0" height="2.0" rx="2" fill="#7ee787"/>
<rect x="511.7" y="386.0" width="11.0" height="2.0" rx="2" fill="#7ee787"/>
<rect x="524.7" y="386.0" width="11.0" height="2.0" rx="2" fill="#7ee787"/>
<text x="96.0" y="408" fill="#8b949e" font-size="13" text-anchor="middle">0 ms</text>
<text x="258.0" y="408" fill="#8b949e" font-size="13" text-anchor="middle">250 ms</text>
<text x="420.0" y="408" fill="#8b949e" font-size="13" text-anchor="middle">500 ms</text>
<text x="582.0" y="408" fill="#8b949e" font-size="13" text-anchor="middle">750 ms</text>
<text x="744.0" y="408" fill="#8b949e" font-size="13" text-anchor="middle">1000 ms</text>
</g></svg>
