<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" font-family="Inter, system-ui, sans-serif">
  <title>Back-of-envelope estimation cheat sheet</title>
  <rect x="0" y="0" width="800" height="480" rx="16" fill="#0d1117"/>
  <text x="32" y="44" fill="#e6edf3" font-size="18" font-weight="600">Back-of-envelope cheat sheet</text>
  <text x="32" y="66" fill="#8b949e" font-size="13">Memorise these; derive everything else out loud.</text>

  <!-- Panel 1: time -->
  <rect x="32" y="86" width="232" height="170" rx="10" fill="none" stroke="#30363d"/>
  <text x="48" y="112" fill="#f78166" font-size="15" font-weight="600">Per day to per second</text>
  <text x="48" y="138" fill="#8b949e" font-size="13">1 day = 86,400 s (about 10^5)</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e6edf3">
    <text x="48" y="166">1 M/day</text><text x="248" y="166" text-anchor="end">11.6 /s</text>
    <text x="48" y="190">100 M/day</text><text x="248" y="190" text-anchor="end">1,157 /s</text>
    <text x="48" y="214">1 B/day</text><text x="248" y="214" text-anchor="end">11,574 /s</text>
    <text x="48" y="238">10 B/day</text><text x="248" y="238" text-anchor="end">115,741 /s</text>
  </g>

  <!-- Panel 2: sizes -->
  <rect x="284" y="86" width="232" height="170" rx="10" fill="none" stroke="#30363d"/>
  <text x="300" y="112" fill="#79c0ff" font-size="15" font-weight="600">Sizes</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e6edf3">
    <text x="300" y="142">2^10</text><text x="500" y="142" text-anchor="end">about 1 thousand (KB)</text>
    <text x="300" y="166">2^20</text><text x="500" y="166" text-anchor="end">about 1 million (MB)</text>
    <text x="300" y="190">2^30</text><text x="500" y="190" text-anchor="end">about 1 billion (GB)</text>
    <text x="300" y="214">2^40</text><text x="500" y="214" text-anchor="end">about 1 trillion (TB)</text>
    <text x="300" y="238">62^7</text><text x="500" y="238" text-anchor="end">3.52 trillion codes</text>
  </g>

  <!-- Panel 3: peak -->
  <rect x="536" y="86" width="232" height="170" rx="10" fill="none" stroke="#30363d"/>
  <text x="552" y="112" fill="#7ee787" font-size="15" font-weight="600">Habits</text>
  <g font-size="13" fill="#e6edf3">
    <text x="552" y="142">Design for peak (2-3x avg)</text>
    <text x="552" y="166">Size caches by distinct keys</text>
    <text x="552" y="190">Multiply storage by replicas</text>
    <text x="552" y="214">Say your rounding direction</text>
    <text x="552" y="238">End each number with a decision</text>
  </g>

  <!-- Latency ladder -->
  <text x="32" y="292" fill="#d2a8ff" font-size="15" font-weight="600">Latency ladder (orders of magnitude, log scale)</text>
  <line x1="48" y1="330" x2="752" y2="330" stroke="#30363d" stroke-width="2"/>
  <g font-size="13">
    <circle cx="60" cy="330" r="6" fill="#d2a8ff"/>
    <text x="60" y="356" fill="#e6edf3" text-anchor="middle">1 ns</text>
    <text x="60" y="374" fill="#8b949e" text-anchor="middle">L1 cache</text>

    <circle cx="190" cy="330" r="6" fill="#d2a8ff"/>
    <text x="190" y="356" fill="#e6edf3" text-anchor="middle">100 ns</text>
    <text x="190" y="374" fill="#8b949e" text-anchor="middle">RAM read</text>

    <circle cx="330" cy="330" r="6" fill="#79c0ff"/>
    <text x="330" y="356" fill="#e6edf3" text-anchor="middle">~100 us</text>
    <text x="330" y="374" fill="#8b949e" text-anchor="middle">SSD random read</text>

    <circle cx="460" cy="330" r="6" fill="#79c0ff"/>
    <text x="460" y="356" fill="#e6edf3" text-anchor="middle">~0.5 ms</text>
    <text x="460" y="374" fill="#8b949e" text-anchor="middle">same-DC RTT</text>

    <circle cx="590" cy="330" r="6" fill="#f78166"/>
    <text x="590" y="356" fill="#e6edf3" text-anchor="middle">~1 ms</text>
    <text x="590" y="374" fill="#8b949e" text-anchor="middle">Redis GET</text>

    <circle cx="720" cy="330" r="6" fill="#f78166"/>
    <text x="720" y="356" fill="#e6edf3" text-anchor="middle">~80-150 ms</text>
    <text x="720" y="374" fill="#8b949e" text-anchor="middle">cross-region RTT</text>
  </g>

  <rect x="32" y="400" width="736" height="52" rx="10" fill="none" stroke="#30363d"/>
  <text x="48" y="424" fill="#e6edf3" font-size="13">Rules of thumb to verify, not trust: one Redis node handles on the order of 100k simple ops/s;</text>
  <text x="48" y="442" fill="#8b949e" font-size="13">one well-tuned relational primary, low thousands to tens of thousands of simple queries/s.</text>
</svg>
