<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" font-family="Inter, system-ui, sans-serif">
  <title>Strangler fig migration in four phases</title>
  <rect x="0" y="0" width="800" height="440" rx="16" fill="#0d1117"/>
  <text x="32" y="44" fill="#e6edf3" font-size="18" font-weight="600">Strangler fig: move slices, then delete</text>
  <text x="32" y="66" fill="#8b949e" font-size="13">Share of traffic served by each system behind the facade, phase by phase.</text>

  <!-- legend -->
  <rect x="520" y="32" width="14" height="14" rx="3" fill="#8b949e"/>
  <text x="542" y="44" fill="#e6edf3" font-size="13">Legacy</text>
  <rect x="610" y="32" width="14" height="14" rx="3" fill="#79c0ff"/>
  <text x="632" y="44" fill="#e6edf3" font-size="13">New system</text>
  <rect x="520" y="54" width="14" height="14" rx="3" fill="none" stroke="#f78166" stroke-width="2"/>
  <text x="542" y="66" fill="#e6edf3" font-size="13">Shadow traffic (not served)</text>

  <!-- facade bar -->
  <rect x="32" y="88" width="736" height="34" rx="8" fill="none" stroke="#d2a8ff"/>
  <text x="400" y="110" fill="#d2a8ff" font-size="14" text-anchor="middle" font-weight="600">Facade / gateway routes every request (added in phase 0, removed last)</text>

  <!-- phases: each column 168 wide, gap 21 -->
  <g font-size="13">
    <!-- Phase 0 -->
    <text x="116" y="150" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Phase 0</text>
    <text x="116" y="170" fill="#8b949e" text-anchor="middle">facade only</text>
    <rect x="52" y="184" width="128" height="160" rx="6" fill="#8b949e"/>
    <text x="116" y="270" fill="#0d1117" text-anchor="middle" font-weight="600">100% legacy</text>

    <!-- Phase 1 -->
    <text x="300" y="150" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Phase 1</text>
    <text x="300" y="170" fill="#8b949e" text-anchor="middle">first slice in shadow</text>
    <rect x="236" y="184" width="128" height="160" rx="6" fill="#8b949e"/>
    <rect x="236" y="184" width="128" height="32" rx="6" fill="none" stroke="#f78166" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="300" y="205" fill="#0d1117" text-anchor="middle" font-weight="600">compare</text>
    <text x="300" y="286" fill="#0d1117" text-anchor="middle" font-weight="600">100% legacy</text>

    <!-- Phase 2 -->
    <text x="484" y="150" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Phase 2</text>
    <text x="484" y="170" fill="#8b949e" text-anchor="middle">slices shifted</text>
    <rect x="420" y="184" width="128" height="80" rx="6" fill="#8b949e"/>
    <rect x="420" y="264" width="128" height="80" rx="6" fill="#79c0ff"/>
    <text x="484" y="229" fill="#0d1117" text-anchor="middle" font-weight="600">legacy</text>
    <text x="484" y="309" fill="#0d1117" text-anchor="middle" font-weight="600">new</text>

    <!-- Phase 3 -->
    <text x="668" y="150" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Phase 3</text>
    <text x="668" y="170" fill="#8b949e" text-anchor="middle">legacy retired</text>
    <rect x="604" y="184" width="128" height="160" rx="6" fill="#79c0ff"/>
    <text x="668" y="270" fill="#0d1117" text-anchor="middle" font-weight="600">100% new</text>
  </g>

  <!-- timeline arrow -->
  <line x1="52" y1="372" x2="740" y2="372" stroke="#30363d" stroke-width="2"/>
  <path d="M748 372 L736 366 L736 378 Z" fill="#30363d"/>
  <text x="52" y="398" fill="#8b949e" font-size="13">Data: legacy is source of truth, CDC streams to new store</text>
  <text x="740" y="398" fill="#8b949e" font-size="13" text-anchor="end">then flip: new store writes, sync back</text>
  <text x="52" y="420" fill="#f78166" font-size="13">Risk zone: migrations most often stall between phase 2 and phase 3.</text>
</svg>
