<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
  <title id="t">Expand, migrate, contract: what each phase changes and where you can roll back to</title>
  <desc id="d">Seven phases. Expand adds the nullable total_minor column and a sync trigger; the app still reads and writes total. Backfill fills old rows in batches. Verify adds a NOT NULL constraint and a new index. Version 2 reads total_minor and writes both columns. Version 3 stops writing total, which becomes nullable. A two-week soak follows. Contract drops the trigger and the old column. Rollback to version 1 is possible until version 3 ships; after that the rollback target is version 2; after contract only a restore brings the old column back.</desc>
  <rect width="800" height="500" rx="16" fill="#0d1117"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="13">
    <text x="32" y="44" font-size="18" font-weight="600" fill="#e6edf3">Expand, migrate, contract</text>
    <text x="32" y="68" fill="#8b949e">Replacing orders.total (numeric) with orders.total_minor (bigint). Every step is its own deploy.</text>

    <g font-weight="600" fill="#8b949e">
      <text x="44" y="102">Phase</text>
      <text x="220" y="102">Schema change</text>
      <text x="448" y="102">App writes</text>
      <text x="574" y="102">App reads</text>
      <text x="676" y="102">Roll back to</text>
    </g>
    <line x1="32" y1="112" x2="768" y2="112" stroke="#30363d"/>

    <!-- row backgrounds and phase markers -->
    <g>
      <rect x="32" y="120" width="6" height="40" rx="3" fill="#79c0ff"/>
      <rect x="32" y="168" width="6" height="40" rx="3" fill="#d2a8ff"/>
      <rect x="32" y="216" width="6" height="40" rx="3" fill="#d2a8ff"/>
      <rect x="32" y="264" width="6" height="40" rx="3" fill="#d2a8ff"/>
      <rect x="32" y="312" width="6" height="40" rx="3" fill="#d2a8ff"/>
      <rect x="32" y="360" width="6" height="40" rx="3" fill="#d2a8ff"/>
      <rect x="32" y="420" width="6" height="40" rx="3" fill="#f78166"/>
    </g>

    <g fill="#e6edf3">
      <text x="44" y="145" font-weight="600">1 Expand</text>
      <text x="44" y="193" font-weight="600">2 Backfill</text>
      <text x="44" y="241" font-weight="600">3 Verify</text>
      <text x="44" y="289" font-weight="600">4 Switch reads (v2)</text>
      <text x="44" y="337" font-weight="600">5 Stop old writes (v3)</text>
      <text x="44" y="385" font-weight="600">6 Soak</text>
      <text x="44" y="445" font-weight="600">7 Contract</text>
    </g>

    <g fill="#e6edf3">
      <text x="220" y="145">add column, sync trigger</text>
      <text x="220" y="193">batched UPDATE job</text>
      <text x="220" y="241">NOT NULL, index CONCURRENTLY</text>
      <text x="220" y="289" fill="#8b949e">none</text>
      <text x="220" y="337">total DROP NOT NULL</text>
      <text x="220" y="385" fill="#8b949e">none (two weeks)</text>
      <text x="220" y="445">drop trigger, drop total</text>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="448" y="145" fill="#e6edf3">total</text>
      <text x="448" y="193" fill="#e6edf3">total</text>
      <text x="448" y="241" fill="#e6edf3">total</text>
      <text x="448" y="289" fill="#d2a8ff">both</text>
      <text x="448" y="337" fill="#79c0ff">total_minor</text>
      <text x="448" y="385" fill="#79c0ff">total_minor</text>
      <text x="448" y="445" fill="#79c0ff">total_minor</text>

      <text x="574" y="145" fill="#e6edf3">total</text>
      <text x="574" y="193" fill="#e6edf3">total</text>
      <text x="574" y="241" fill="#e6edf3">total</text>
      <text x="574" y="289" fill="#79c0ff">total_minor</text>
      <text x="574" y="337" fill="#79c0ff">total_minor</text>
      <text x="574" y="385" fill="#79c0ff">total_minor</text>
      <text x="574" y="445" fill="#79c0ff">total_minor</text>
    </g>

    <g>
      <text x="676" y="145" fill="#7ee787">v1</text>
      <text x="676" y="193" fill="#7ee787">stop the job</text>
      <text x="676" y="241" fill="#7ee787">v1</text>
      <text x="676" y="289" fill="#7ee787">v1</text>
      <text x="676" y="337" fill="#d2a8ff">v2 only</text>
      <text x="676" y="385" fill="#d2a8ff">v2 only</text>
      <text x="676" y="445" fill="#f78166">restore only</text>
    </g>

    <line x1="32" y1="410" x2="768" y2="410" stroke="#f78166" stroke-dasharray="6 5"/>
    <text x="768" y="404" fill="#f78166" text-anchor="end">point of no return</text>

    <g fill="#8b949e">
      <rect x="32" y="470" width="12" height="12" rx="3" fill="#79c0ff"/>
      <text x="50" y="481">expand</text>
      <rect x="116" y="470" width="12" height="12" rx="3" fill="#d2a8ff"/>
      <text x="134" y="481">migrate</text>
      <rect x="204" y="470" width="12" height="12" rx="3" fill="#f78166"/>
      <text x="222" y="481">contract</text>
      <text x="768" y="481" text-anchor="end">N and N+1 app versions must both work at every step</text>
    </g>
  </g>
</svg>
