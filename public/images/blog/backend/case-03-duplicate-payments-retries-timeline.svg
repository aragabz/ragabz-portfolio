<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d">
  <title id="t">Incident timeline: duplicate payments from retries</title>
  <desc id="d">A horizontal timeline. At T+0 PSP latency rises. At T+4 minutes gateway and service timeouts begin and retries multiply. At T+18 the first charged-twice ticket arrives. At T+41 an incident is declared. At T+52 gateway POST retries are disabled and at T+63 the service-level retry is turned off, which stops new duplicates. At T+3 hours duplicates are identified and refunds begin. The permanent end-to-end idempotency fix ships at T+2 days.</desc>
  <rect x="0" y="0" width="800" height="460" rx="16" fill="#0d1117"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="32" y="44" font-size="18" font-weight="600" fill="#e6edf3">Timeline: 63 minutes of duplicates, two days to fix properly</text>
    <text x="32" y="68" font-size="13" fill="#8b949e">Composite scenario, illustrative times</text>

    <!-- impact band -->
    <rect x="70" y="112" width="380" height="14" rx="4" fill="#f78166" opacity="0.35"/>
    <text x="70" y="104" font-size="13" fill="#f78166">duplicate charges being created</text>

    <line x1="40" y1="160" x2="760" y2="160" stroke="#30363d" stroke-width="2"/>

    <!-- markers -->
    <g font-size="13">
      <circle cx="70" cy="160" r="7" fill="#f78166"/>
      <text x="58" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6edf3">T+0</text>
      <text x="40" y="210" fill="#8b949e">PSP p99</text>
      <text x="40" y="228" fill="#8b949e">0.8s to 9s</text>

      <circle cx="140" cy="160" r="7" fill="#f78166"/>
      <text x="124" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6edf3">T+4m</text>
      <text x="116" y="270" fill="#8b949e">timeouts,</text>
      <text x="116" y="288" fill="#8b949e">retries x3 x3</text>
      <line x1="140" y1="167" x2="140" y2="234" stroke="#30363d"/>

      <circle cx="220" cy="160" r="7" fill="#d2a8ff"/>
      <text x="200" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6edf3">T+18m</text>
      <text x="190" y="210" fill="#8b949e">first "charged</text>
      <text x="190" y="228" fill="#8b949e">twice" ticket</text>

      <circle cx="310" cy="160" r="7" fill="#d2a8ff"/>
      <text x="290" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6edf3">T+41m</text>
      <text x="280" y="270" fill="#8b949e">incident</text>
      <text x="280" y="288" fill="#8b949e">declared</text>
      <line x1="310" y1="167" x2="310" y2="234" stroke="#30363d"/>

      <circle cx="380" cy="160" r="7" fill="#79c0ff"/>
      <text x="362" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6edf3">T+52m</text>
      <text x="352" y="210" fill="#8b949e">gateway POST</text>
      <text x="352" y="228" fill="#8b949e">retries off</text>

      <circle cx="450" cy="160" r="7" fill="#79c0ff"/>
      <text x="432" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6edf3">T+63m</text>
      <text x="424" y="270" fill="#8b949e">service retry</text>
      <text x="424" y="288" fill="#8b949e">off: bleeding stops</text>
      <line x1="450" y1="167" x2="450" y2="234" stroke="#30363d"/>

      <circle cx="590" cy="160" r="7" fill="#7ee787"/>
      <text x="574" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6edf3">T+3h</text>
      <text x="548" y="210" fill="#8b949e">duplicates listed,</text>
      <text x="548" y="228" fill="#8b949e">voids + refunds</text>

      <circle cx="720" cy="160" r="7" fill="#7ee787"/>
      <text x="700" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6edf3">T+2d</text>
      <text x="660" y="270" fill="#8b949e">end-to-end</text>
      <text x="660" y="288" fill="#8b949e">idempotency ships</text>
      <line x1="720" y1="167" x2="720" y2="234" stroke="#30363d"/>
    </g>

    <!-- legend -->
    <rect x="32" y="330" width="736" height="104" rx="10" fill="#161b22" stroke="#30363d"/>
    <circle cx="56" cy="360" r="6" fill="#f78166"/>
    <text x="70" y="365" font-size="13" fill="#e6edf3">trigger: dependency slows down</text>
    <circle cx="330" cy="360" r="6" fill="#d2a8ff"/>
    <text x="344" y="365" font-size="13" fill="#e6edf3">detection (by customers, not alerts)</text>
    <circle cx="56" cy="396" r="6" fill="#79c0ff"/>
    <text x="70" y="401" font-size="13" fill="#e6edf3">mitigation: remove retry layers</text>
    <circle cx="330" cy="396" r="6" fill="#7ee787"/>
    <text x="344" y="401" font-size="13" fill="#e6edf3">remediation and permanent fix</text>
    <text x="56" y="424" font-size="13" fill="#8b949e">41 minutes from first duplicate to declared incident: no alert watched charges per order</text>
  </g>
</svg>
