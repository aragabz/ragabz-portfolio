<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Incident timeline: Kafka consumer lag after a deploy</title>
  <desc id="d">A lag curve over time. At T+0 version 2.14 is rolled out. Lag starts climbing almost linearly. At T+6 minutes the first poll timeout warnings appear, at T+15 the lag alert fires, at T+31 the group is seen rebalancing continuously, at T+38 a thread dump points at the enrichment HTTP call, at T+44 the rollback starts and at T+52 the group is stable. Twenty-three partitions catch up by T+76, but partition 7 keeps a long tail until the batching hotfix at T+1 hour 35 and is caught up at about T+1 hour 50.</desc>
  <rect x="0" y="0" width="800" height="480" rx="16" fill="#0d1117"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="32" y="44" font-size="18" font-weight="600" fill="#e6edf3">Timeline: lag climbs for 52 minutes, one partition lags for two hours</text>
    <text x="32" y="68" font-size="13" fill="#8b949e">Composite scenario, illustrative times and values</text>

    <!-- axes -->
    <line x1="72" y1="300" x2="768" y2="300" stroke="#30363d" stroke-width="2"/>
    <line x1="72" y1="96" x2="72" y2="300" stroke="#30363d" stroke-width="2"/>
    <text x="32" y="104" font-size="13" fill="#8b949e">lag</text>

    <!-- total lag curve: rises to T+52, drains by T+66 -->
    <path d="M 72 298 L 110 296 L 330 120 L 380 118 L 440 290 L 460 296 L 768 297" fill="none" stroke="#f78166" stroke-width="3"/>
    <!-- partition 7 tail -->
    <path d="M 440 262 L 520 262 L 560 258 L 700 296 L 768 298" fill="none" stroke="#d2a8ff" stroke-width="3" stroke-dasharray="6 4"/>

    <g font-size="13">
      <text x="236" y="146" fill="#f78166">total lag</text>
      <text x="548" y="248" fill="#d2a8ff">partition 7 only</text>
    </g>

    <!-- markers on axis: x = 72 + minutes*~4.2 for first hour, compressed later -->
    <g font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6edf3">
      <line x1="72" y1="300" x2="72" y2="310" stroke="#8b949e"/><text x="62" y="326">T+0</text>
      <line x1="135" y1="300" x2="135" y2="310" stroke="#8b949e"/><text x="122" y="326">+15</text>
      <line x1="232" y1="300" x2="232" y2="310" stroke="#8b949e"/><text x="219" y="326">+38</text>
      <line x1="257" y1="300" x2="257" y2="310" stroke="#8b949e"/><text x="248" y="342">+44</text>
      <line x1="330" y1="300" x2="330" y2="310" stroke="#8b949e"/><text x="317" y="326">+52</text>
      <line x1="440" y1="300" x2="440" y2="310" stroke="#8b949e"/><text x="427" y="326">+76</text>
      <line x1="560" y1="300" x2="560" y2="310" stroke="#8b949e"/><text x="538" y="326">+1h35</text>
      <line x1="700" y1="300" x2="700" y2="310" stroke="#8b949e"/><text x="680" y="326">+1h50</text>
    </g>

    <!-- event list -->
    <rect x="32" y="356" width="736" height="104" rx="10" fill="#161b22" stroke="#30363d"/>
    <g font-size="13">
      <text x="52" y="382" fill="#f78166">T+0</text><text x="96" y="382" fill="#e6edf3">v2.14 rolled out</text>
      <text x="52" y="404" fill="#f78166">+15</text><text x="96" y="404" fill="#e6edf3">time-lag alert fires</text>
      <text x="52" y="426" fill="#79c0ff">+38</text><text x="96" y="426" fill="#e6edf3">thread dump: enrichment call</text>
      <text x="52" y="448" fill="#79c0ff">+44</text><text x="96" y="448" fill="#e6edf3">rollback starts</text>

      <text x="410" y="382" fill="#79c0ff">+52</text><text x="456" y="382" fill="#e6edf3">group Stable, draining</text>
      <text x="410" y="404" fill="#7ee787">+76</text><text x="456" y="404" fill="#e6edf3">23 of 24 partitions caught up</text>
      <text x="410" y="426" fill="#d2a8ff">+1h35</text><text x="456" y="426" fill="#e6edf3">batch-write hotfix for hot partition</text>
      <text x="410" y="448" fill="#7ee787">+1h50</text><text x="456" y="448" fill="#e6edf3">partition 7 caught up</text>
    </g>
  </g>
</svg>
