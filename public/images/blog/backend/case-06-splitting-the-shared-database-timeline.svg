<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d">
<title id="t">Timeline of the failed first cut-over</title>
<desc id="d">The first billing cut-over starts at T+0 when writes move to the new billing service. Refunds fail on a foreign key at T+4, a support tool fails at T+9, rollback is decided at T+12 and complete at T+20, stranded invoices are replayed by T+55, reconciliation is clean at T+95, and the next morning finance finds 1,340 audit log entries stamped with the replay time instead of the issue time.</desc>
<rect x="0" y="0" width="800" height="460" rx="16" fill="#0d1117"/>
<g font-family="Inter, system-ui, sans-serif">
<text x="32" y="44" fill="#e6edf3" font-size="18" font-weight="600">Cut-over night: 12 minutes forward, 95 minutes back</text>
<text x="32" y="68" fill="#8b949e" font-size="13">Composite scenario. Minutes after writes were flipped to billing-service at 22:00.</text>
<rect x="48" y="92" width="75" height="26" rx="4" fill="#f78166" fill-opacity="0.18" stroke="#f78166"/>
<text x="85" y="110" fill="#f78166" font-size="13" text-anchor="middle">cut-over</text>
<rect x="123" y="92" width="50" height="26" rx="4" fill="#d2a8ff" fill-opacity="0.18" stroke="#d2a8ff"/>
<text x="148" y="110" fill="#d2a8ff" font-size="13" text-anchor="middle">back</text>
<rect x="173" y="92" width="467" height="26" rx="4" fill="#79c0ff" fill-opacity="0.18" stroke="#79c0ff"/>
<text x="406" y="110" fill="#79c0ff" font-size="13" text-anchor="middle">repair: replay stranded writes, reconcile</text>
<rect x="680" y="92" width="80" height="26" rx="4" fill="#f78166" fill-opacity="0.18" stroke="#f78166"/>
<text x="720" y="110" fill="#f78166" font-size="13" text-anchor="middle">next day</text>
<line x1="48" y1="170" x2="652" y2="170" stroke="#8b949e" stroke-width="1.5"/>
<line x1="664" y1="162" x2="672" y2="178" stroke="#8b949e" stroke-width="1.5"/>
<line x1="672" y1="162" x2="680" y2="178" stroke="#8b949e" stroke-width="1.5"/>
<line x1="692" y1="170" x2="752" y2="170" stroke="#8b949e" stroke-width="1.5"/>
<text x="48" y="208" fill="#8b949e" font-size="13" text-anchor="middle">T+0</text>
<text x="173" y="208" fill="#8b949e" font-size="13" text-anchor="middle">T+20</text>
<text x="297" y="208" fill="#8b949e" font-size="13" text-anchor="middle">T+40</text>
<text x="422" y="208" fill="#8b949e" font-size="13" text-anchor="middle">T+60</text>
<text x="547" y="208" fill="#8b949e" font-size="13" text-anchor="middle">T+80</text>
<text x="720" y="208" fill="#8b949e" font-size="13" text-anchor="middle">T+11 h</text>
<g font-size="13" font-weight="600" text-anchor="middle">
<circle cx="48" cy="170" r="10" fill="#f78166"/><text x="48" y="175" fill="#0d1117">1</text>
<circle cx="73" cy="170" r="10" fill="#f78166"/><text x="73" y="175" fill="#0d1117">2</text>
<circle cx="104" cy="170" r="10" fill="#f78166"/><text x="104" y="175" fill="#0d1117">3</text>
<circle cx="128" cy="170" r="10" fill="#d2a8ff"/><text x="128" y="175" fill="#0d1117">4</text>
<circle cx="173" cy="170" r="10" fill="#d2a8ff"/><text x="173" y="175" fill="#0d1117">5</text>
<circle cx="391" cy="170" r="10" fill="#79c0ff"/><text x="391" y="175" fill="#0d1117">6</text>
<circle cx="640" cy="170" r="10" fill="#79c0ff"/><text x="640" y="175" fill="#0d1117">7</text>
<circle cx="720" cy="170" r="10" fill="#f78166"/><text x="720" y="175" fill="#0d1117">8</text>
</g>
<g font-size="13" fill="#e6edf3">
<text x="48" y="252"><tspan fill="#f78166" font-weight="600">1  T+0  </tspan> All invoice writes switched to billing-service</text>
<text x="48" y="278"><tspan fill="#f78166" font-weight="600">2  T+4  </tspan> Refunds fail: foreign key violation (SQLSTATE 23503)</text>
<text x="48" y="304"><tspan fill="#f78166" font-weight="600">3  T+9  </tspan> Support tool: apply_credit() finds no invoice</text>
<text x="48" y="330"><tspan fill="#d2a8ff" font-weight="600">4  T+12 </tspan> Decision: roll writes back to the monolith</text>
<text x="48" y="356"><tspan fill="#d2a8ff" font-weight="600">5  T+20 </tspan> Monolith writing again. 1,340 invoices exist only in the billing DB</text>
<text x="48" y="382"><tspan fill="#79c0ff" font-weight="600">6  T+55 </tspan> Stranded invoices replayed into the shared DB (IDs do not collide)</text>
<text x="48" y="408"><tspan fill="#79c0ff" font-weight="600">7  T+95 </tspan> Reconciliation clean, incident closed</text>
<text x="48" y="434"><tspan fill="#f78166" font-weight="600">8  T+11 h</tspan> Finance: 1,340 audit entries carry replay times, not issue times</text>
</g>
</g></svg>
