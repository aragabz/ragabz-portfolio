<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d">
  <title id="t">Priority lanes for notifications</title>
  <desc id="d">Three separate lanes, each with its own queue and worker pool. The critical lane carries one-time passcodes and security alerts with a target of seconds and is never throttled by other traffic. The transactional lane carries order and account updates with a target of under a minute. The bulk lane carries marketing campaigns, is rate-shaped and can be paused, with a target of minutes to hours. A backlog in the bulk lane cannot delay the critical lane.</desc>
  <rect x="0" y="0" width="800" height="460" rx="16" fill="#0d1117"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="32" y="44" font-size="18" font-weight="600" fill="#e6edf3">Separate lanes, not one queue with a priority field</text>
    <text x="32" y="70" font-size="14" fill="#8b949e">Each lane has its own topic, consumers and provider quota share</text>

    <g font-size="13" fill="#8b949e">
      <text x="52" y="108">lane</text>
      <text x="250" y="108">queue (backlog)</text>
      <text x="500" y="108">workers</text>
      <text x="640" y="108">target</text>
    </g>

    <!-- critical -->
    <rect x="32" y="120" width="736" height="88" rx="10" fill="#161b22" stroke="#f78166" stroke-width="1.5"/>
    <text x="52" y="152" font-size="16" font-weight="600" fill="#f78166">Critical</text>
    <text x="52" y="176" font-size="13" fill="#8b949e">OTP, security alerts</text>
    <rect x="250" y="146" width="40" height="28" rx="4" fill="#f78166"/>
    <text x="300" y="166" font-size="13" fill="#8b949e">near empty</text>
    <g fill="#e6edf3"><circle cx="510" cy="160" r="8"/><circle cx="534" cy="160" r="8"/><circle cx="558" cy="160" r="8"/></g>
    <text x="500" y="192" font-size="13" fill="#8b949e">reserved</text>
    <text x="640" y="166" font-size="14" fill="#e6edf3">seconds</text>

    <!-- transactional -->
    <rect x="32" y="220" width="736" height="88" rx="10" fill="#161b22" stroke="#79c0ff" stroke-width="1.5"/>
    <text x="52" y="252" font-size="16" font-weight="600" fill="#79c0ff">Transactional</text>
    <text x="52" y="276" font-size="13" fill="#8b949e">order shipped, replies</text>
    <rect x="250" y="246" width="40" height="28" rx="4" fill="#79c0ff"/>
    <rect x="294" y="246" width="40" height="28" rx="4" fill="#79c0ff"/>
    <text x="344" y="266" font-size="13" fill="#8b949e">small</text>
    <g fill="#e6edf3"><circle cx="510" cy="260" r="8"/><circle cx="534" cy="260" r="8"/><circle cx="558" cy="260" r="8"/><circle cx="582" cy="260" r="8"/></g>
    <text x="500" y="292" font-size="13" fill="#8b949e">autoscaled</text>
    <text x="640" y="266" font-size="14" fill="#e6edf3">under 1 min</text>

    <!-- bulk -->
    <rect x="32" y="320" width="736" height="88" rx="10" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
    <text x="52" y="352" font-size="16" font-weight="600" fill="#d2a8ff">Bulk</text>
    <text x="52" y="376" font-size="13" fill="#8b949e">campaigns, digests</text>
    <g fill="#d2a8ff">
      <rect x="250" y="346" width="40" height="28" rx="4"/>
      <rect x="294" y="346" width="40" height="28" rx="4"/>
      <rect x="338" y="346" width="40" height="28" rx="4"/>
      <rect x="382" y="346" width="40" height="28" rx="4"/>
      <rect x="426" y="346" width="40" height="28" rx="4"/>
    </g>
    <g fill="#e6edf3"><circle cx="510" cy="360" r="8"/><circle cx="534" cy="360" r="8"/></g>
    <text x="500" y="392" font-size="13" fill="#8b949e">rate-shaped</text>
    <text x="640" y="366" font-size="14" fill="#e6edf3">minutes to hours</text>

    <text x="32" y="436" font-size="14" fill="#7ee787">A 50-million-message campaign backlog in Bulk never delays an OTP in Critical.</text>
  </g>
</svg>
