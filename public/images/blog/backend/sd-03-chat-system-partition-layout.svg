<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d">
  <title id="t">Wide-column message layout with a single owner per conversation</title>
  <desc id="d">Sends for conversation 9001 are routed to one owner, which assigns the next sequence number and writes to partition (9001, bucket 0). Each partition holds rows clustered by sequence number in descending order. Another conversation lives in its own partitions on other nodes.</desc>
  <rect width="800" height="460" rx="16" fill="#0d1117"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="400" y="44" font-size="18" font-weight="600" fill="#e6edf3" text-anchor="middle">One owner orders a conversation, one partition stores a range</text>
    <text x="400" y="68" font-size="13" fill="#8b949e" text-anchor="middle">PRIMARY KEY ((conversation_id, bucket), seq) with bucket = seq / 10,000</text>

    <!-- senders -->
    <rect x="32" y="104" width="150" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="107" y="129" font-size="14" fill="#e6edf3" text-anchor="middle">Alice phone</text>
    <rect x="32" y="156" width="150" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="107" y="181" font-size="14" fill="#e6edf3" text-anchor="middle">Bob laptop</text>
    <rect x="32" y="208" width="150" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="107" y="233" font-size="14" fill="#e6edf3" text-anchor="middle">Carol phone</text>

    <!-- arrows to owner -->
    <g stroke="#79c0ff" stroke-width="1.5" fill="none">
      <path d="M182 124 L232 164"/>
      <path d="M182 176 L232 176"/>
      <path d="M182 228 L232 188"/>
      <path d="M422 176 L470 176"/>
    </g>
    <g fill="#79c0ff">
      <polygon points="232,164 222,163 227,155"/>
      <polygon points="232,176 224,171 224,181"/>
      <polygon points="232,188 227,197 222,189"/>
      <polygon points="470,176 462,171 462,181"/>
    </g>

    <!-- owner -->
    <rect x="236" y="130" width="186" height="92" rx="10" fill="#161b22" stroke="#f78166" stroke-width="1.5"/>
    <text x="329" y="156" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Owner of c_9001</text>
    <text x="329" y="178" font-size="13" fill="#8b949e" text-anchor="middle">dedup clientMsgId</text>
    <text x="329" y="198" font-size="13" fill="#8b949e" text-anchor="middle">seq = last + 1, then write</text>

    <!-- partition -->
    <rect x="474" y="96" width="294" height="214" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="1.5"/>
    <text x="490" y="122" font-size="14" font-weight="600" fill="#e6edf3">Partition (9001, bucket 0)</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <rect x="490" y="134" width="262" height="30" rx="5" fill="#0d1117" stroke="#f78166"/>
      <text x="502" y="154" fill="#f78166">seq 1043</text>
      <text x="600" y="154" fill="#e6edf3">u_42 "Running 5 min..."</text>
      <rect x="490" y="170" width="262" height="30" rx="5" fill="#0d1117" stroke="#30363d"/>
      <text x="502" y="190" fill="#7ee787">seq 1042</text>
      <text x="600" y="190" fill="#8b949e">u_7  "On my way"</text>
      <rect x="490" y="206" width="262" height="30" rx="5" fill="#0d1117" stroke="#30363d"/>
      <text x="502" y="226" fill="#7ee787">seq 1041</text>
      <text x="600" y="226" fill="#8b949e">u_9  "Where are we?"</text>
      <rect x="490" y="242" width="262" height="30" rx="5" fill="#0d1117" stroke="#30363d"/>
      <text x="502" y="262" fill="#7ee787">seq 1040</text>
      <text x="600" y="262" fill="#8b949e">u_42 "Dinner at 7"</text>
    </g>
    <text x="621" y="296" font-size="13" fill="#8b949e" text-anchor="middle">clustered newest first, so "latest 50" is one scan</text>

    <!-- other partitions -->
    <rect x="32" y="340" width="230" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-dasharray="4 4"/>
    <text x="147" y="368" font-size="14" fill="#e6edf3" text-anchor="middle">(9001, bucket 1)</text>
    <text x="147" y="390" font-size="13" fill="#8b949e" text-anchor="middle">seq 10,000 to 19,999</text>
    <text x="147" y="410" font-size="13" fill="#8b949e" text-anchor="middle">created when seq gets there</text>

    <rect x="285" y="340" width="230" height="84" rx="10" fill="#161b22" stroke="#d2a8ff"/>
    <text x="400" y="368" font-size="14" fill="#e6edf3" text-anchor="middle">(77, bucket 0)</text>
    <text x="400" y="390" font-size="13" fill="#8b949e" text-anchor="middle">another conversation,</text>
    <text x="400" y="410" font-size="13" fill="#8b949e" text-anchor="middle">another owner, other nodes</text>

    <rect x="538" y="340" width="230" height="84" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="653" y="368" font-size="14" fill="#e6edf3" text-anchor="middle">Replication factor 3</text>
    <text x="653" y="390" font-size="13" fill="#8b949e" text-anchor="middle">write and read at</text>
    <text x="653" y="410" font-size="13" fill="#8b949e" text-anchor="middle">LOCAL_QUORUM (2 of 3)</text>
  </g>
</svg>
