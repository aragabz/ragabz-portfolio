<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
  <title id="t">Per-device sync cursors and read watermarks on one conversation</title>
  <desc id="d">Conversation c_9001 has messages with sequence numbers 1035 to 1046. Bob's phone cursor is at 1046. Bob's laptop was offline with its cursor at 1039 and fetches 1040 to 1046 on reconnect. Alice's read watermark is 1044, meaning she has read everything up to 1044. A device that holds 1045 and receives 1047 detects that 1046 is missing and fetches it.</desc>
  <rect width="800" height="440" rx="16" fill="#0d1117"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="400" y="44" font-size="18" font-weight="600" fill="#e6edf3" text-anchor="middle">Dense sequence numbers make sync and gap detection cheap</text>
    <text x="400" y="68" font-size="13" fill="#8b949e" text-anchor="middle">Every device stores the highest seq it holds contiguously, per conversation</text>

    <text x="32" y="122" font-size="14" fill="#8b949e">c_9001</text>
    <!-- 12 cells from x=96, width 54 -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle">
      <rect x="96" y="100" width="50" height="34" rx="5" fill="#161b22" stroke="#30363d"/><text x="121" y="122" fill="#e6edf3">1035</text>
      <rect x="150" y="100" width="50" height="34" rx="5" fill="#161b22" stroke="#30363d"/><text x="175" y="122" fill="#e6edf3">1036</text>
      <rect x="204" y="100" width="50" height="34" rx="5" fill="#161b22" stroke="#30363d"/><text x="229" y="122" fill="#e6edf3">1037</text>
      <rect x="258" y="100" width="50" height="34" rx="5" fill="#161b22" stroke="#30363d"/><text x="283" y="122" fill="#e6edf3">1038</text>
      <rect x="312" y="100" width="50" height="34" rx="5" fill="#161b22" stroke="#30363d"/><text x="337" y="122" fill="#e6edf3">1039</text>
      <rect x="366" y="100" width="50" height="34" rx="5" fill="#161b22" stroke="#79c0ff"/><text x="391" y="122" fill="#e6edf3">1040</text>
      <rect x="420" y="100" width="50" height="34" rx="5" fill="#161b22" stroke="#79c0ff"/><text x="445" y="122" fill="#e6edf3">1041</text>
      <rect x="474" y="100" width="50" height="34" rx="5" fill="#161b22" stroke="#79c0ff"/><text x="499" y="122" fill="#e6edf3">1042</text>
      <rect x="528" y="100" width="50" height="34" rx="5" fill="#161b22" stroke="#79c0ff"/><text x="553" y="122" fill="#e6edf3">1043</text>
      <rect x="582" y="100" width="50" height="34" rx="5" fill="#161b22" stroke="#79c0ff"/><text x="607" y="122" fill="#e6edf3">1044</text>
      <rect x="636" y="100" width="50" height="34" rx="5" fill="#161b22" stroke="#79c0ff"/><text x="661" y="122" fill="#e6edf3">1045</text>
      <rect x="690" y="100" width="50" height="34" rx="5" fill="#161b22" stroke="#79c0ff"/><text x="715" y="122" fill="#e6edf3">1046</text>
    </g>

    <!-- Bob phone cursor -->
    <line x1="740" y1="140" x2="740" y2="176" stroke="#7ee787" stroke-width="2"/>
    <text x="740" y="194" font-size="13" fill="#7ee787" text-anchor="end">Bob phone: cursor 1046 (caught up)</text>

    <!-- Bob laptop cursor and fetch range -->
    <line x1="362" y1="140" x2="362" y2="226" stroke="#f78166" stroke-width="2"/>
    <text x="96" y="244" font-size="13" fill="#f78166">Bob laptop: cursor 1039 (offline)</text>
    <rect x="366" y="214" width="374" height="24" rx="5" fill="none" stroke="#79c0ff" stroke-dasharray="5 4"/>
    <text x="553" y="231" font-size="13" fill="#79c0ff" text-anchor="middle">on reconnect: fetch seq &gt; 1039</text>

    <!-- Alice read watermark -->
    <line x1="632" y1="140" x2="632" y2="274" stroke="#d2a8ff" stroke-width="2"/>
    <text x="620" y="290" font-size="13" fill="#d2a8ff" text-anchor="end">Alice last_read_seq = 1044: everything up to here is read</text>

    <!-- gap detection box -->
    <rect x="32" y="318" width="736" height="94" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="52" y="346" font-size="14" font-weight="600" fill="#e6edf3">Gap detection on the real-time path</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle">
      <rect x="52" y="362" width="50" height="30" rx="5" fill="#0d1117" stroke="#7ee787"/><text x="77" y="382" fill="#e6edf3">1045</text>
      <rect x="110" y="362" width="50" height="30" rx="5" fill="#0d1117" stroke="#f78166" stroke-dasharray="4 3"/><text x="135" y="382" fill="#f78166">1046?</text>
      <rect x="168" y="362" width="50" height="30" rx="5" fill="#0d1117" stroke="#7ee787"/><text x="193" y="382" fill="#e6edf3">1047</text>
    </g>
    <text x="240" y="374" font-size="13" fill="#8b949e">Received 1047 while holding 1045, so 1046 exists and was missed.</text>
    <text x="240" y="394" font-size="13" fill="#8b949e">Fetch it by range, keep the cursor at 1045 until the gap is filled.</text>
  </g>
</svg>
