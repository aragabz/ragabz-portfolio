  <text x="40" y="370" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">256 logical shards in production,</text>
  <text x="40" y="388" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">far more than scheduler nodes.</text>
  <text x="32" y="434" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">Owners poll the current and overdue buckets every ~200 ms and hand due runs to the dispatch queue.</text>
