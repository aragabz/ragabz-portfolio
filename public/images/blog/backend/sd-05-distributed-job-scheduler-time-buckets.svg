<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d">
  <title id="t">Due jobs partitioned by shard and one-minute time bucket</title>
  <desc id="d">A grid with shards as rows and minute buckets as columns. Buckets before now are drained, the current bucket is being scanned by its shard owner, future buckets wait. Each shard is owned by one scheduler instance holding a lease with an epoch number. The 10:03 column is much larger because many cron schedules fire at the same minute.</desc>
  <rect width="800" height="460" rx="16" fill="#0d1117"/>
  <text x="32" y="44" fill="#e6edf3" font-size="18" font-weight="600" font-family="Inter, system-ui, sans-serif">Partitioned time buckets</text>
  <text x="32" y="68" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">Key = (shard_id, minute_bucket). A shard owner only ever reads its own rows, oldest bucket first.</text>
