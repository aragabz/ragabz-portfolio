<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-labelledby="t d">
  <title id="t">Flash sale admission funnel from two million visitors to fifty thousand seats</title>
  <desc id="d">Two million visitors join the waiting room. Admission is capped at about 1,667 users per minute so that at most 5,000 shoppers are in the booking flow. About 33,000 admitted shoppers produce 20,000 orders for 50,000 seats, and the sale sells out after about 20 minutes. The remaining 1.97 million visitors are never admitted and should be told early.</desc>
  <rect width="800" height="490" rx="16" fill="#0d1117"/>
  <text x="32" y="44" fill="#e6edf3" font-size="18" font-weight="600" font-family="Inter, system-ui, sans-serif">The waiting room is a funnel, not a line</text>
  <text x="32" y="68" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">Illustrative numbers from Step 2. Admission rate is set by what the booking path can handle.</text>
  <rect x="44" y="96" width="712" height="50" rx="8" fill="#79c0ff" fill-opacity="0.14" stroke="#79c0ff"/>
  <text x="60" y="118" fill="#e6edf3" font-size="14" font-weight="600" font-family="Inter, system-ui, sans-serif">Waiting room</text>
  <text x="60" y="136" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">static page at the CDN</text>
  <text x="740" y="128" fill="#e6edf3" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2,000,000</text>
  <rect x="110" y="158" width="580" height="50" rx="8" fill="#d2a8ff" fill-opacity="0.14" stroke="#d2a8ff"/>
  <text x="126" y="180" fill="#e6edf3" font-size="14" font-weight="600" font-family="Inter, system-ui, sans-serif">Admitted</text>
  <text x="126" y="198" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">1,667 per minute for ~20 min</text>
  <text x="674" y="190" fill="#e6edf3" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~33,000</text>
  <rect x="170" y="220" width="460" height="50" rx="8" fill="#f78166" fill-opacity="0.14" stroke="#f78166"/>
  <text x="186" y="242" fill="#e6edf3" font-size="14" font-weight="600" font-family="Inter, system-ui, sans-serif">Shopping now</text>
  <text x="186" y="260" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">3-minute session, holds 10 min</text>
  <text x="614" y="252" fill="#e6edf3" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">5,000 max</text>
  <rect x="220" y="282" width="360" height="50" rx="8" fill="#7ee787" fill-opacity="0.14" stroke="#7ee787"/>
  <text x="236" y="304" fill="#e6edf3" font-size="14" font-weight="600" font-family="Inter, system-ui, sans-serif">Orders</text>
  <text x="236" y="322" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">2.5 seats per order</text>
  <text x="564" y="314" fill="#e6edf3" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">20,000</text>
  <rect x="220" y="344" width="360" height="50" rx="8" fill="#7ee787" fill-opacity="0.14" stroke="#7ee787"/>
  <text x="236" y="366" fill="#e6edf3" font-size="14" font-weight="600" font-family="Inter, system-ui, sans-serif">Seats sold</text>
  <text x="236" y="384" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">zero oversell</text>
  <text x="564" y="376" fill="#e6edf3" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">50,000</text>
  <rect x="32" y="412" width="736" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="400" y="439" fill="#e6edf3" font-size="13" text-anchor="middle" font-family="Inter, system-ui, sans-serif">About 1.97 million visitors never reach the seat map. Tell them early, once remaining inventory is spoken for.</text>
</svg>
