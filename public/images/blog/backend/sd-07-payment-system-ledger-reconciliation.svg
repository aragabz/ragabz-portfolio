<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
  <title id="t">Three-way reconciliation: ledger, PSP settlement report, bank statement</title>
  <desc id="d">The internal ledger is matched to the PSP settlement report by PSP reference, and the PSP payout is matched to the bank statement by payout batch. Breaks fall into four categories and go to a queue with an owner and an SLO.</desc>
  <rect width="800" height="470" rx="16" fill="#0d1117"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <g font-family="Inter, system-ui, sans-serif" text-anchor="middle">
    <text x="400" y="42" font-size="18" font-weight="600" fill="#e6edf3">Three-way reconciliation</text>
    <text x="400" y="66" font-size="13" fill="#8b949e">Each source is independent. Agreement between all three is what lets finance close the books.</text>

    <!-- sources -->
    <rect x="40" y="92" width="200" height="104" rx="10" fill="#161b22" stroke="#79c0ff"/>
    <text x="140" y="120" font-size="15" font-weight="600" fill="#e6edf3">Internal ledger</text>
    <text x="140" y="144" font-size="13" fill="#8b949e">journal entries</text>
    <text x="140" y="164" font-size="13" fill="#8b949e">per payment, refund,</text>
    <text x="140" y="184" font-size="13" fill="#8b949e">fee and payout</text>

    <rect x="300" y="92" width="200" height="104" rx="10" fill="#161b22" stroke="#d2a8ff"/>
    <text x="400" y="120" font-size="15" font-weight="600" fill="#e6edf3">PSP settlement report</text>
    <text x="400" y="144" font-size="13" fill="#8b949e">charges, refunds, fees,</text>
    <text x="400" y="164" font-size="13" fill="#8b949e">disputes per batch,</text>
    <text x="400" y="184" font-size="13" fill="#8b949e">net payout amount</text>

    <rect x="560" y="92" width="200" height="104" rx="10" fill="#161b22" stroke="#7ee787"/>
    <text x="660" y="120" font-size="15" font-weight="600" fill="#e6edf3">Bank statement</text>
    <text x="660" y="144" font-size="13" fill="#8b949e">incoming transfer</text>
    <text x="660" y="164" font-size="13" fill="#8b949e">from the PSP,</text>
    <text x="660" y="184" font-size="13" fill="#8b949e">outgoing payouts</text>

    <line x1="244" y1="144" x2="296" y2="144" stroke="#8b949e" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="504" y1="144" x2="556" y2="144" stroke="#8b949e" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="270" y="222" font-size="13" fill="#e6edf3">match by PSP reference</text>
    <text x="530" y="222" font-size="13" fill="#e6edf3">match by payout batch</text>
    <text x="270" y="240" font-size="13" fill="#8b949e">line by line, daily</text>
    <text x="530" y="240" font-size="13" fill="#8b949e">net amount, per payout</text>

    <!-- breaks -->
    <text x="400" y="282" font-size="15" font-weight="600" fill="#e6edf3">Categories of breaks</text>
    <rect x="40" y="296" width="170" height="78" rx="8" fill="#161b22" stroke="#f78166"/>
    <text x="125" y="320" font-size="14" fill="#e6edf3">Missing in ledger</text>
    <text x="125" y="342" font-size="13" fill="#8b949e">lost webhook, or</text>
    <text x="125" y="360" font-size="13" fill="#8b949e">an UNKNOWN success</text>
    <rect x="224" y="296" width="170" height="78" rx="8" fill="#161b22" stroke="#f78166"/>
    <text x="309" y="320" font-size="14" fill="#e6edf3">Missing at PSP</text>
    <text x="309" y="342" font-size="13" fill="#8b949e">we posted a capture</text>
    <text x="309" y="360" font-size="13" fill="#8b949e">the PSP never made</text>
    <rect x="408" y="296" width="170" height="78" rx="8" fill="#161b22" stroke="#f78166"/>
    <text x="493" y="320" font-size="14" fill="#e6edf3">Amount mismatch</text>
    <text x="493" y="342" font-size="13" fill="#8b949e">fees, rounding,</text>
    <text x="493" y="360" font-size="13" fill="#8b949e">partial capture</text>
    <rect x="592" y="296" width="168" height="78" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="676" y="320" font-size="14" fill="#e6edf3">Timing</text>
    <text x="676" y="342" font-size="13" fill="#8b949e">in flight across the</text>
    <text x="676" y="360" font-size="13" fill="#8b949e">report cutoff</text>

    <rect x="40" y="392" width="720" height="48" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 4"/>
    <text x="400" y="421" font-size="13" fill="#e6edf3">Break queue with owner, age and SLO: auto-fix through the state machine, or an approved adjustment entry</text>
  </g>
</svg>
