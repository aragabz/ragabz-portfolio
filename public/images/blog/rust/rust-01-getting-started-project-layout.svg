<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Layout of a cargo project</title>
  <desc id="d">A cargo project contains Cargo.toml for metadata and dependencies, Cargo.lock with exact versions, src/main.rs as the binary root or src/lib.rs as the library root, src/bin for extra binaries, tests for integration tests, examples for runnable examples, and target for build output that is never committed.</desc>
  <rect width="800" height="480" rx="16" fill="#0d1117"/>
  <text x="32" y="44" fill="#e6edf3" font-size="18" font-weight="600" font-family="Inter, system-ui, sans-serif">What cargo new gives you, and what grows later</text>
  <text x="32" y="68" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">Convention over configuration: cargo finds everything by location.</text>
  <rect x="24" y="88" width="300" height="320" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="340" y="88" width="436" height="320" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="44" y="118" fill="#e6edf3" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">hello-rust/</text>
  <text x="44" y="148" fill="#f78166" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">├── Cargo.toml</text>
  <circle cx="356" cy="144" r="4" fill="#f78166"/>
  <text x="370" y="148" fill="#e6edf3" font-size="13" font-family="Inter, system-ui, sans-serif">Manifest: name, edition, dependencies</text>
  <text x="44" y="178" fill="#ffa657" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">├── Cargo.lock</text>
  <circle cx="356" cy="174" r="4" fill="#ffa657"/>
  <text x="370" y="178" fill="#e6edf3" font-size="13" font-family="Inter, system-ui, sans-serif">Exact dependency versions; generated</text>
  <text x="44" y="208" fill="#e6edf3" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">├── src/</text>
  <text x="44" y="238" fill="#79c0ff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">│   ├── main.rs</text>
  <circle cx="356" cy="234" r="4" fill="#79c0ff"/>
  <text x="370" y="238" fill="#e6edf3" font-size="13" font-family="Inter, system-ui, sans-serif">Binary crate root: fn main</text>
  <text x="44" y="268" fill="#79c0ff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">│   ├── lib.rs</text>
  <circle cx="356" cy="264" r="4" fill="#79c0ff"/>
  <text x="370" y="268" fill="#e6edf3" font-size="13" font-family="Inter, system-ui, sans-serif">Library crate root (optional)</text>
  <text x="44" y="298" fill="#79c0ff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">│   └── bin/other.rs</text>
  <circle cx="356" cy="294" r="4" fill="#79c0ff"/>
  <text x="370" y="298" fill="#e6edf3" font-size="13" font-family="Inter, system-ui, sans-serif">Extra binaries</text>
  <text x="44" y="328" fill="#7ee787" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">├── tests/</text>
  <circle cx="356" cy="324" r="4" fill="#7ee787"/>
  <text x="370" y="328" fill="#e6edf3" font-size="13" font-family="Inter, system-ui, sans-serif">Integration tests, public API only</text>
  <text x="44" y="358" fill="#d2a8ff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">├── examples/</text>
  <circle cx="356" cy="354" r="4" fill="#d2a8ff"/>
  <text x="370" y="358" fill="#e6edf3" font-size="13" font-family="Inter, system-ui, sans-serif">Runnable examples</text>
  <text x="44" y="388" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">└── target/</text>
  <circle cx="356" cy="384" r="4" fill="#8b949e"/>
  <text x="370" y="388" fill="#e6edf3" font-size="13" font-family="Inter, system-ui, sans-serif">Build output (debug/, release/); never commit</text>
  <text x="32" y="446" fill="#8b949e" font-size="12" font-family="Inter, system-ui, sans-serif">Created by cargo new: Cargo.toml, src/main.rs, .gitignore. Cargo.lock and target/ appear on first build.</text>
</svg>
