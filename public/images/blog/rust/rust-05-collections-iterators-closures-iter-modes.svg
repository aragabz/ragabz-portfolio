<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
  <title id="t">iter, iter_mut and into_iter compared</title>
  <desc id="d">The same Vec of Strings iterated three ways. iter lends shared references and the Vec stays usable. iter_mut lends mutable references so elements can be changed in place, and the Vec stays usable. into_iter moves each String out and consumes the Vec, which can no longer be used.</desc>
  <rect width="800" height="400" rx="16" fill="#0d1117"/>
  <text x="32" y="44" fill="#e6edf3" font-size="18" font-weight="600" font-family="Inter, system-ui, sans-serif">Three ways to loop over names: Vec&lt;String&gt;</text>
  <text x="32" y="68" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">The difference is ownership: who holds the elements during and after the loop.</text>
  <rect x="32" y="96" width="232" height="270" rx="12" fill="#161b22" stroke="#79c0ff" stroke-width="2"/>
  <text x="52" y="126" fill="#79c0ff" font-size="15" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">names.iter()</text>
  <text x="52" y="148" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">for n in &amp;names</text>
  <text x="52" y="184" fill="#e6edf3" font-size="13" font-family="Inter, system-ui, sans-serif">yields  &amp;String</text>
  <text x="52" y="208" fill="#e6edf3" font-size="13" font-family="Inter, system-ui, sans-serif">read only</text>
  <rect x="52" y="230" width="60" height="30" fill="#79c0ff" fill-opacity="0.3" stroke="#79c0ff"/>
  <rect x="112" y="230" width="60" height="30" fill="#79c0ff" fill-opacity="0.3" stroke="#79c0ff"/>
  <text x="64" y="250" fill="#e6edf3" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">"ana"</text>
  <text x="128" y="250" fill="#e6edf3" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">"bo"</text>
  <text x="52" y="300" fill="#7ee787" font-size="13" font-weight="600" font-family="Inter, system-ui, sans-serif">after: names usable</text>
  <text x="52" y="324" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">cannot push during loop</text>
  <rect x="284" y="96" width="232" height="270" rx="12" fill="#161b22" stroke="#ffa657" stroke-width="2"/>
  <text x="304" y="126" fill="#ffa657" font-size="15" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">names.iter_mut()</text>
  <text x="304" y="148" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">for n in &amp;mut names</text>
  <text x="304" y="184" fill="#e6edf3" font-size="13" font-family="Inter, system-ui, sans-serif">yields  &amp;mut String</text>
  <text x="304" y="208" fill="#e6edf3" font-size="13" font-family="Inter, system-ui, sans-serif">modify in place</text>
  <rect x="304" y="230" width="60" height="30" fill="#ffa657" fill-opacity="0.3" stroke="#ffa657"/>
  <rect x="364" y="230" width="60" height="30" fill="#ffa657" fill-opacity="0.3" stroke="#ffa657"/>
  <text x="316" y="250" fill="#e6edf3" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">"ANA"</text>
  <text x="380" y="250" fill="#e6edf3" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">"BO"</text>
  <text x="304" y="300" fill="#7ee787" font-size="13" font-weight="600" font-family="Inter, system-ui, sans-serif">after: names usable</text>
  <text x="304" y="324" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">exclusive borrow in loop</text>
  <rect x="536" y="96" width="232" height="270" rx="12" fill="#161b22" stroke="#f78166" stroke-width="2"/>
  <text x="556" y="126" fill="#f78166" font-size="15" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">names.into_iter()</text>
  <text x="556" y="148" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">for n in names</text>
  <text x="556" y="184" fill="#e6edf3" font-size="13" font-family="Inter, system-ui, sans-serif">yields  String (owned)</text>
  <text x="556" y="208" fill="#e6edf3" font-size="13" font-family="Inter, system-ui, sans-serif">move elements out</text>
  <rect x="556" y="230" width="60" height="30" fill="#161b22" stroke="#30363d" stroke-dasharray="4 3"/>
  <rect x="616" y="230" width="60" height="30" fill="#161b22" stroke="#30363d" stroke-dasharray="4 3"/>
  <line x1="646" y1="260" x2="700" y2="278" stroke="#f78166" stroke-width="1.5"/>
  <text x="684" y="292" fill="#f78166" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">n</text>
  <text x="556" y="324" fill="#f78166" font-size="13" font-weight="600" font-family="Inter, system-ui, sans-serif">after: names moved</text>
  <text x="556" y="346" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">no allocation, no clones</text>
</svg>
