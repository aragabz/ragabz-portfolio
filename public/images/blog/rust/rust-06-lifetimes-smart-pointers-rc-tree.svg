<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
  <title id="t">A tree with Rc children and Weak parents</title>
  <desc id="d">root owns src through a strong Rc edge, and src owns main.rs. Each child points back to its parent with a Weak edge that does not count as ownership. src has strong count 2, from the local handle and root's children vector, and weak count 1, from main.rs. Dropping the root and handles brings all strong counts to zero and frees the tree. If the parent edges were Rc, the cycle would leak.</desc>
  <rect width="800" height="400" rx="16" fill="#0d1117"/>
  <text x="32" y="44" fill="#e6edf3" font-size="18" font-weight="600" font-family="Inter, system-ui, sans-serif">Parents own children, children only point back</text>
  <text x="32" y="68" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">Strong edges (Rc) form a tree with no cycles. Weak edges do not keep anything alive.</text>
  <rect x="300" y="96" width="200" height="56" rx="10" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="320" y="120" fill="#e6edf3" font-size="13" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">root</text>
  <text x="320" y="140" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">strong 1, weak 1</text>
  <rect x="300" y="196" width="200" height="56" rx="10" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="320" y="220" fill="#e6edf3" font-size="13" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">src</text>
  <text x="320" y="240" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">strong 2, weak 1</text>
  <rect x="300" y="296" width="200" height="56" rx="10" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="320" y="320" fill="#e6edf3" font-size="13" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">main.rs</text>
  <text x="320" y="340" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">strong 2, weak 0</text>
  <line x1="360" y1="152" x2="360" y2="192" stroke="#7ee787" stroke-width="3"/>
  <polygon points="360,194 354,184 366,184" fill="#7ee787"/>
  <line x1="360" y1="252" x2="360" y2="292" stroke="#7ee787" stroke-width="3"/>
  <polygon points="360,294 354,284 366,284" fill="#7ee787"/>
  <line x1="440" y1="194" x2="440" y2="156" stroke="#79c0ff" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="440,154 434,164 446,164" fill="#79c0ff"/>
  <line x1="440" y1="294" x2="440" y2="256" stroke="#79c0ff" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="440,254 434,264 446,264" fill="#79c0ff"/>
  <line x1="32" y1="120" x2="72" y2="120" stroke="#7ee787" stroke-width="3"/>
  <text x="84" y="124" fill="#7ee787" font-size="13" font-family="Inter, system-ui, sans-serif">Rc: children vec</text>
  <text x="84" y="142" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">owns, counts as strong</text>
  <line x1="32" y1="180" x2="72" y2="180" stroke="#79c0ff" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="84" y="184" fill="#79c0ff" font-size="13" font-family="Inter, system-ui, sans-serif">Weak: parent pointer</text>
  <text x="84" y="202" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">upgrade() returns Option</text>
  <text x="32" y="250" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">Extra strong counts come</text>
  <text x="32" y="268" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">from local handles</text>
  <rect x="540" y="196" width="228" height="76" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="1.5"/>
  <text x="556" y="220" fill="#7ee787" font-size="13" font-weight="600" font-family="Inter, system-ui, sans-serif">Drop root and handles</text>
  <text x="556" y="240" fill="#e6edf3" font-size="13" font-family="Inter, system-ui, sans-serif">strong counts reach 0</text>
  <text x="556" y="258" fill="#e6edf3" font-size="13" font-family="Inter, system-ui, sans-serif">whole tree is freed</text>
  <rect x="540" y="290" width="228" height="76" rx="10" fill="#161b22" stroke="#f78166" stroke-width="1.5"/>
  <text x="556" y="314" fill="#f78166" font-size="13" font-weight="600" font-family="Inter, system-ui, sans-serif">If parent edges were Rc</text>
  <text x="556" y="334" fill="#e6edf3" font-size="13" font-family="Inter, system-ui, sans-serif">parent and child keep each</text>
  <text x="556" y="352" fill="#e6edf3" font-size="13" font-family="Inter, system-ui, sans-serif">other alive: memory leak</text>
</svg>
