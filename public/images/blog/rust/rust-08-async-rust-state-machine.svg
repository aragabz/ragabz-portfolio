<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d">
  <title id="t">An async fn compiles into a state machine</title>
  <desc id="d">On the left, an async function that awaits fetch_user and then fetch_orders. On the right, the enum the compiler generates: a Start state holding the id, an AwaitingUser state holding the id and the inner user future, an AwaitingOrders state holding the user and the inner orders future, and a Done state. Each poll advances the machine until an inner future returns Pending.</desc>
  <rect width="800" height="460" rx="16" fill="#0d1117"/>
  <text x="32" y="44" fill="#e6edf3" font-size="18" font-weight="600" font-family="Inter, system-ui, sans-serif">An async fn is a state machine the compiler writes for you</text>
  <text x="32" y="68" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">Each .await is a point where the function can pause. Locals that live across it become fields.</text>
  <rect x="32" y="92" width="330" height="200" rx="12" fill="#161b22" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="52" y="120" fill="#79c0ff" font-size="14" font-weight="600" font-family="Inter, system-ui, sans-serif">What you write</text>
  <text x="52" y="152" fill="#e6edf3" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">async fn load(id: u64) -&gt; Page {</text>
  <text x="68" y="176" fill="#e6edf3" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">let user = fetch_user(id)</text>
  <text x="84" y="196" fill="#ffa657" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.await;</text>
  <text x="68" y="220" fill="#e6edf3" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">let orders = fetch_orders(id)</text>
  <text x="84" y="240" fill="#ffa657" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.await;</text>
  <text x="68" y="264" fill="#e6edf3" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Page { user, orders }</text>
  <text x="52" y="284" fill="#e6edf3" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">}</text>
  <text x="32" y="324" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">Calling load(7) runs nothing.</text>
  <text x="32" y="344" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">It returns the enum in its Start state.</text>
  <text x="32" y="364" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">An executor must poll it to make progress.</text>
  <rect x="420" y="92" width="348" height="58" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <text x="440" y="117" fill="#e6edf3" font-size="14" font-weight="600" font-family="Inter, system-ui, sans-serif">Start</text>
  <text x="440" y="137" fill="#8b949e" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">{ id }</text>
  <rect x="420" y="172" width="348" height="58" rx="10" fill="#161b22" stroke="#ffa657" stroke-width="1.5"/>
  <text x="440" y="197" fill="#ffa657" font-size="14" font-weight="600" font-family="Inter, system-ui, sans-serif">AwaitingUser</text>
  <text x="440" y="217" fill="#8b949e" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">{ id, fut: FetchUserFuture }</text>
  <rect x="420" y="252" width="348" height="58" rx="10" fill="#161b22" stroke="#ffa657" stroke-width="1.5"/>
  <text x="440" y="277" fill="#ffa657" font-size="14" font-weight="600" font-family="Inter, system-ui, sans-serif">AwaitingOrders</text>
  <text x="440" y="297" fill="#8b949e" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">{ user, fut: FetchOrdersFuture }</text>
  <rect x="420" y="332" width="348" height="58" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="1.5"/>
  <text x="440" y="357" fill="#7ee787" font-size="14" font-weight="600" font-family="Inter, system-ui, sans-serif">Done</text>
  <text x="440" y="377" fill="#8b949e" font-size="12" font-family="Inter, system-ui, sans-serif">Ready(page) returned; polling again panics</text>
  <line x1="594" y1="150" x2="594" y2="170" stroke="#e6edf3" stroke-width="1.5"/>
  <line x1="594" y1="230" x2="594" y2="250" stroke="#e6edf3" stroke-width="1.5"/>
  <line x1="594" y1="310" x2="594" y2="330" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="604" y="165" fill="#8b949e" font-size="11" font-family="Inter, system-ui, sans-serif">first poll</text>
  <text x="604" y="245" fill="#8b949e" font-size="11" font-family="Inter, system-ui, sans-serif">inner future Ready</text>
  <text x="604" y="325" fill="#8b949e" font-size="11" font-family="Inter, system-ui, sans-serif">inner future Ready</text>
  <text x="32" y="420" fill="#e6edf3" font-size="13" font-family="Inter, system-ui, sans-serif">While an inner future returns Pending, poll returns Pending and the machine stays in the same state.</text>
  <text x="32" y="442" fill="#8b949e" font-size="12" font-family="Inter, system-ui, sans-serif">Size of the future = the largest state. Holding big buffers or non-Send values across .await shows up here.</text>
</svg>
