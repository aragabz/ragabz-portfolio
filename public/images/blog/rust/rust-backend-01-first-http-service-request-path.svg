<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">The layers a request passes through in an axum service</title>
  <desc id="d">Nested boxes: the Tokio runtime contains hyper, which contains tower layers, which contain the axum router, which contains the extractors, which wrap the handler. The request travels inward and the response travels back out through the same layers.</desc>
  <rect width="800" height="480" rx="16" fill="#0d1117"/>
  <text x="32" y="44" fill="#e6edf3" font-size="18" font-weight="600" font-family="Inter, system-ui, sans-serif">One request through orders-api</text>
  <text x="32" y="68" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">Each layer wraps the next. The request travels inward, the response travels back out.</text>
  <rect x="32" y="92" width="500" height="340" rx="12" fill="#161b22" stroke="#79c0ff" stroke-width="2"/>
  <text x="48" y="116" fill="#79c0ff" font-size="14" font-weight="600" font-family="Inter, system-ui, sans-serif">Tokio runtime</text>
  <text x="160" y="116" fill="#8b949e" font-size="12" font-family="Inter, system-ui, sans-serif">worker threads, I/O driver, timers</text>
  <rect x="52" y="140" width="460" height="280" rx="10" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="68" y="164" fill="#d2a8ff" font-size="14" font-weight="600" font-family="Inter, system-ui, sans-serif">hyper</text>
  <text x="118" y="164" fill="#8b949e" font-size="12" font-family="Inter, system-ui, sans-serif">HTTP/1 and HTTP/2 framing</text>
  <rect x="72" y="184" width="420" height="224" rx="10" fill="#161b22" stroke="#ffa657" stroke-width="2"/>
  <text x="88" y="208" fill="#ffa657" font-size="14" font-weight="600" font-family="Inter, system-ui, sans-serif">tower layers</text>
  <text x="188" y="208" fill="#8b949e" font-size="12" font-family="Inter, system-ui, sans-serif">trace, request id, timeout</text>
  <rect x="92" y="228" width="380" height="168" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text x="108" y="252" fill="#7ee787" font-size="14" font-weight="600" font-family="Inter, system-ui, sans-serif">axum Router</text>
  <text x="200" y="252" fill="#8b949e" font-size="12" font-family="Inter, system-ui, sans-serif">match method and path</text>
  <rect x="112" y="268" width="340" height="116" rx="10" fill="#161b22" stroke="#f78166" stroke-width="2"/>
  <text x="128" y="292" fill="#f78166" font-size="14" font-weight="600" font-family="Inter, system-ui, sans-serif">Extractors</text>
  <text x="212" y="292" fill="#8b949e" font-size="12" font-family="Inter, system-ui, sans-serif">State, Path, Query, Json</text>
  <rect x="132" y="308" width="300" height="64" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="148" y="334" fill="#e6edf3" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">async fn create_order(...)</text>
  <text x="148" y="356" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">  -&gt; impl IntoResponse</text>
  <line x1="556" y1="104" x2="556" y2="330" stroke="#79c0ff" stroke-width="2"/>
  <polygon points="550,326 562,326 556,338" fill="#79c0ff"/>
  <text x="572" y="112" fill="#e6edf3" font-size="13" font-weight="600" font-family="Inter, system-ui, sans-serif">Request goes in</text>
  <text x="572" y="140" fill="#79c0ff" font-size="12" font-family="Inter, system-ui, sans-serif">Accept TCP, spawn a task</text>
  <text x="572" y="168" fill="#d2a8ff" font-size="12" font-family="Inter, system-ui, sans-serif">Bytes become http::Request</text>
  <text x="572" y="196" fill="#ffa657" font-size="12" font-family="Inter, system-ui, sans-serif">Each layer is a Service</text>
  <text x="572" y="212" fill="#ffa657" font-size="12" font-family="Inter, system-ui, sans-serif">that wraps a Service</text>
  <text x="572" y="240" fill="#7ee787" font-size="12" font-family="Inter, system-ui, sans-serif">404 or 405 if nothing matches</text>
  <text x="572" y="268" fill="#f78166" font-size="12" font-family="Inter, system-ui, sans-serif">Rejection: handler never runs</text>
  <text x="572" y="296" fill="#e6edf3" font-size="12" font-family="Inter, system-ui, sans-serif">Your code: typed arguments</text>
  <line x1="556" y1="352" x2="556" y2="420" stroke="#7ee787" stroke-width="2"/>
  <polygon points="550,356 562,356 556,344" fill="#7ee787"/>
  <text x="572" y="372" fill="#e6edf3" font-size="13" font-weight="600" font-family="Inter, system-ui, sans-serif">Response comes out</text>
  <text x="572" y="392" fill="#8b949e" font-size="12" font-family="Inter, system-ui, sans-serif">IntoResponse builds status,</text>
  <text x="572" y="408" fill="#8b949e" font-size="12" font-family="Inter, system-ui, sans-serif">headers and body</text>
  <text x="32" y="460" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">From hyper inward, everything speaks tower::Service: a request in, a future of a response out.</text>
</svg>
