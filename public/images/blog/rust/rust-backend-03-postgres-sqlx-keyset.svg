<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d">
  <title id="t">OFFSET pagination versus keyset pagination</title>
  <desc id="d">Fetching the third page of 20 orders. With OFFSET 40, Postgres reads 60 rows and discards the first 40, and the work grows with page depth. With keyset pagination, the index seeks directly to the row after the cursor and reads only the 20 rows returned, so every page costs the same.</desc>
  <rect width="800" height="460" rx="16" fill="#0d1117"/>
  <text x="32" y="44" fill="#e6edf3" font-size="18" font-weight="600" font-family="Inter, system-ui, sans-serif">Fetching page 3 of a customer's orders</text>
  <text x="32" y="68" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">Each cell is one index entry, newest first. Same result, very different work.</text>
  <text x="32" y="108" fill="#f78166" font-size="15" font-weight="600" font-family="Inter, system-ui, sans-serif">OFFSET 40 LIMIT 20</text>
