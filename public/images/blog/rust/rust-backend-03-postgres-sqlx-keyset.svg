  <text x="520" y="174" fill="#79c0ff" font-size="12" font-family="Inter, system-ui, sans-serif">20 rows returned</text>
  <text x="40" y="198" fill="#8b949e" font-size="12" font-family="Inter, system-ui, sans-serif">Page 500 reads 10,000 rows. A new order arriving shifts every row by one: duplicates or gaps.</text>
  <text x="32" y="248" fill="#7ee787" font-size="15" font-weight="600" font-family="Inter, system-ui, sans-serif">WHERE (created_at, id) &lt; (cursor) LIMIT 20</text>
