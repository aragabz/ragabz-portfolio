<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d">
  <title id="t">Graceful shutdown timeline of an orders-api pod</title>
  <desc id="d">When Kubernetes deletes the pod, it sends SIGTERM while endpoint removal propagates in parallel. orders-api fails readiness and keeps serving during a drain delay, then stops accepting connections, finishes in-flight requests, cancels background workers, closes the database pool and exits. Everything must finish before terminationGracePeriodSeconds, after which the kubelet sends SIGKILL.</desc>
  <rect width="800" height="460" rx="16" fill="#0d1117"/>
  <text x="32" y="44" fill="#e6edf3" font-size="18" font-weight="600" font-family="Inter, system-ui, sans-serif">From SIGTERM to exit inside the grace period</text>
  <text x="32" y="68" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">Illustrative timings for orders-api with terminationGracePeriodSeconds: 30.</text>
  <line x1="60" y1="120" x2="740" y2="120" stroke="#30363d" stroke-width="2"/>
  <line x1="60" y1="110" x2="60" y2="130" stroke="#e6edf3" stroke-width="2"/>
  <text x="48" y="104" fill="#e6edf3" font-size="12" font-family="Inter, system-ui, sans-serif">0 s</text>
  <line x1="173" y1="112" x2="173" y2="128" stroke="#8b949e" stroke-width="1.5"/>
  <text x="166" y="104" fill="#8b949e" font-size="12" font-family="Inter, system-ui, sans-serif">5 s</text>
  <line x1="286" y1="112" x2="286" y2="128" stroke="#8b949e" stroke-width="1.5"/>
  <text x="276" y="104" fill="#8b949e" font-size="12" font-family="Inter, system-ui, sans-serif">10 s</text>
  <line x1="513" y1="112" x2="513" y2="128" stroke="#8b949e" stroke-width="1.5"/>
  <text x="503" y="104" fill="#8b949e" font-size="12" font-family="Inter, system-ui, sans-serif">20 s</text>
  <line x1="740" y1="106" x2="740" y2="400" stroke="#f78166" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="676" y="104" fill="#f78166" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">30 s SIGKILL</text>
  <text x="32" y="164" fill="#8b949e" font-size="12" font-family="Inter, system-ui, sans-serif">Kubernetes</text>
  <rect x="60" y="174" width="140" height="40" rx="8" fill="#161b22" stroke="#79c0ff" stroke-width="2"/>
  <text x="72" y="199" fill="#79c0ff" font-size="13" font-family="Inter, system-ui, sans-serif">endpoints update</text>
  <text x="212" y="199" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">kube-proxy, ingress and mesh catch up asynchronously</text>
  <text x="32" y="246" fill="#8b949e" font-size="12" font-family="Inter, system-ui, sans-serif">orders-api</text>
  <rect x="60" y="256" width="113" height="56" rx="8" fill="#161b22" stroke="#ffa657" stroke-width="2"/>
  <text x="70" y="279" fill="#ffa657" font-size="13" font-weight="600" font-family="Inter, system-ui, sans-serif">drain delay</text>
  <text x="70" y="299" fill="#8b949e" font-size="12" font-family="Inter, system-ui, sans-serif">readyz = 503</text>
  <rect x="177" y="256" width="150" height="56" rx="8" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text x="187" y="279" fill="#7ee787" font-size="13" font-weight="600" font-family="Inter, system-ui, sans-serif">stop accepting</text>
  <text x="187" y="299" fill="#8b949e" font-size="12" font-family="Inter, system-ui, sans-serif">finish in-flight</text>
  <rect x="331" y="256" width="150" height="56" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="341" y="279" fill="#d2a8ff" font-size="13" font-weight="600" font-family="Inter, system-ui, sans-serif">cancel workers</text>
  <text x="341" y="299" fill="#8b949e" font-size="12" font-family="Inter, system-ui, sans-serif">outbox, consumer</text>
  <rect x="485" y="256" width="110" height="56" rx="8" fill="#161b22" stroke="#79c0ff" stroke-width="2"/>
  <text x="495" y="279" fill="#79c0ff" font-size="13" font-weight="600" font-family="Inter, system-ui, sans-serif">close pool</text>
  <text x="495" y="299" fill="#8b949e" font-size="12" font-family="Inter, system-ui, sans-serif">flush OTel</text>
  <rect x="599" y="256" width="60" height="56" rx="8" fill="#161b22" stroke="#e6edf3" stroke-width="2"/>
  <text x="614" y="289" fill="#e6edf3" font-size="13" font-weight="600" font-family="Inter, system-ui, sans-serif">exit 0</text>
  <rect x="663" y="256" width="73" height="56" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="672" y="289" fill="#8b949e" font-size="12" font-family="Inter, system-ui, sans-serif">headroom</text>
  <text x="32" y="356" fill="#e6edf3" font-size="13" font-family="Inter, system-ui, sans-serif">Why the drain delay exists: SIGTERM and endpoint removal race. Without it, the pod</text>
  <text x="32" y="376" fill="#e6edf3" font-size="13" font-family="Inter, system-ui, sans-serif">stops listening while some load balancers still route to it, and clients see resets.</text>
  <text x="32" y="420" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">Rule of thumb: drain delay + longest request + worker stop + pool close &lt; grace period.</text>
  <text x="32" y="440" fill="#8b949e" font-size="13" font-family="Inter, system-ui, sans-serif">Distroless has no shell, so do the delay in the app or use the native preStop sleep action.</text>
</svg>
