<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Ultimacode Dashboard — SaaS analytics platform</title>
<desc>Dark cover image with blue and cyan accents for the aragabz/ultimacode-dashboard repository, a Next.js SaaS analytics dashboard. Shows the project name, its stack (Next.js, TypeScript, PostgreSQL, Prisma, Chart.js) and a dashboard mockup with a sidebar and an area chart.</desc>
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
    .display { font-family: 'Space Grotesk', 'Segoe UI', sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
  </style>

  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#070D16"/>
    <stop offset="55%" stop-color="#08111D"/>
    <stop offset="100%" stop-color="#04080E"/>
  </linearGradient>

  <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#60A5FA"/>
    <stop offset="55%" stop-color="#38BDF8"/>
    <stop offset="100%" stop-color="#67E8F9"/>
  </linearGradient>

  <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
  </linearGradient>

  <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>

  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="30"/>
  </filter>

  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.2" cy="1.2" r="1.2" fill="#FFFFFF" opacity="0.05"/>
  </pattern>
</defs>

<rect width="1200" height="630" fill="url(#bgGrad)"/>
<rect width="1200" height="630" fill="url(#dots)"/>

<circle cx="120" cy="80" r="260" fill="url(#glowBlue)" filter="url(#soft)"/>
<circle cx="980" cy="540" r="280" fill="url(#glowCyan)" filter="url(#soft)"/>

<rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#152238" stroke-width="1"/>

<rect x="80" y="90" width="252" height="30" rx="15" fill="#0D1624" stroke="#23405E" stroke-width="1"/>
<circle cx="98" cy="105" r="4" fill="#38BDF8"/>
<text x="112" y="110" class="mono" font-size="13" letter-spacing="1.5" fill="#7AC7F5">SAAS ANALYTICS DASHBOARD</text>

<text x="76" y="210" class="display" font-size="86" font-weight="700" fill="url(#titleGrad)">Ultimacode</text>
<text x="76" y="292" class="display" font-size="86" font-weight="700" fill="url(#titleGrad)">Dashboard</text>

<text x="80" y="330" class="display" font-size="19" font-weight="500" fill="#90A7C4">
  <tspan x="80" dy="0">Code quality and developer productivity</tspan>
  <tspan x="80" dy="26">metrics, aggregated and visualised in real time.</tspan>
</text>

<g class="mono" font-size="15" font-weight="500">
  <rect x="80" y="396" width="112" height="42" rx="21" fill="#0D1626" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="136" y="422" text-anchor="middle" fill="#8FC4F7">Next.js</text>

  <rect x="208" y="396" width="128" height="42" rx="21" fill="#0D1626" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="272" y="422" text-anchor="middle" fill="#7FD6F7">TypeScript</text>

  <rect x="352" y="396" width="150" height="42" rx="21" fill="#0D1626" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="427" y="422" text-anchor="middle" fill="#A9D5FB">PostgreSQL</text>

  <rect x="80" y="452" width="120" height="42" rx="21" fill="#0D1626" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="140" y="478" text-anchor="middle" fill="#8FC4F7">Prisma</text>

  <rect x="216" y="452" width="128" height="42" rx="21" fill="#0D1626" stroke="#22D3EE" stroke-width="1.2"/>
  <text x="280" y="478" text-anchor="middle" fill="#7FD6F7">Chart.js</text>

  <rect x="360" y="452" width="126" height="42" rx="21" fill="#0D1626" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="423" y="478" text-anchor="middle" fill="#A9D5FB">Tailwind</text>
</g>

<rect x="80" y="522" width="478" height="46" rx="10" fill="#08101C" stroke="#12203E" stroke-width="1"/>
<circle cx="102" cy="545" r="4" fill="#34D399"/>
<text x="118" y="550" class="mono" font-size="15" fill="#C7DAEE">git clone github.com/aragabz/ultimacode-dashboard</text>

<text x="80" y="600" class="mono" font-size="14" fill="#44607C">github.com/aragabz/ultimacode-dashboard · live demo</text>

<!-- Dashboard browser mockup on the right -->
<g transform="translate(950,330)">
  <rect x="-180" y="-190" width="360" height="380" rx="16" fill="#0A1322" stroke="#1A2F4A" stroke-width="1.5"/>
  <circle cx="-156" cy="-166" r="5" fill="#F87171"/>
  <circle cx="-136" cy="-166" r="5" fill="#FBBF24"/>
  <circle cx="-116" cy="-166" r="5" fill="#34D399"/>
  <rect x="-92" y="-172" width="170" height="24" rx="8" fill="#0D1828" stroke="#162842" stroke-width="1"/>

  <!-- Sidebar -->
  <rect x="-180" y="-142" width="52" height="332" fill="#0B1420"/>
  <rect x="-156" y="-128" width="8" height="8" rx="2" fill="#38BDF8"/>
  <rect x="-156" y="-108" width="8" height="8" rx="2" fill="#1E3A52"/>
  <rect x="-156" y="-88" width="8" height="8" rx="2" fill="#1E3A52"/>
  <rect x="-156" y="-68" width="8" height="8" rx="2" fill="#1E3A52"/>
  <rect x="-156" y="-48" width="8" height="8" rx="2" fill="#1E3A52"/>

  <!-- Stat cards -->
  <rect x="-118" y="-142" width="120" height="52" rx="8" fill="#0F1B2C" stroke="#1A2F4A" stroke-width="1"/>
  <rect x="-106" y="-132" width="38" height="8" rx="4" fill="#2A4562"/>
  <rect x="-106" y="-116" width="52" height="14" rx="4" fill="#38BDF8"/>

  <rect x="-118" y="-78" width="120" height="52" rx="8" fill="#0F1B2C" stroke="#1A2F4A" stroke-width="1"/>
  <rect x="-106" y="-68" width="34" height="8" rx="4" fill="#2A4562"/>
  <rect x="-106" y="-52" width="44" height="10" rx="4" fill="#67E8F9"/>

  <!-- Area chart -->
  <rect x="-122" y="56" width="282" height="124" rx="8" fill="#0F1B2C" stroke="#1A2F4A" stroke-width="1"/>
  <path d="M-106 150 L-62 138 L-22 128 L22 118 L62 132 L102 96 L142 78" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M-106 150 L-62 138 L-22 128 L22 118 L62 132 L102 96 L142 78 L142 178 L-106 178 Z" fill="url(#chartGrad)"/>
  <circle cx="142" cy="78" r="4" fill="#38BDF8"/>
  <line x1="-116" y1="68" x2="156" y2="68" stroke="#152842" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="-116" y1="112" x2="156" y2="112" stroke="#152842" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Mini bars -->
  <rect x="-116" y="116" width="20" height="36" rx="3" fill="#1E3A52"/>
  <rect x="18" y="126" width="20" height="36" rx="3" fill="#1E3A52"/>
  <rect x="120" y="100" width="20" height="36" rx="3" fill="#2563EB"/>
</g>
</svg>