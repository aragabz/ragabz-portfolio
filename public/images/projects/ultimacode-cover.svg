    <rect x="-70" y="-14" width="70" height="10" rx="5" fill="#3A3F55"/>
    <rect x="-70" y="6" width="90" height="8" rx="4" fill="#262B3C"/>

    <rect x="-84" y="48" width="168" height="66" rx="14" fill="#141726" stroke="#242A3D" stroke-width="1"/>
    <rect x="-70" y="64" width="70" height="10" rx="5" fill="#3A3F55"/>
    <rect x="-70" y="84" width="100" height="8" rx="4" fill="#262B3C"/>
  </g>

  <rect x="-102" y="150" width="204" height="63" rx="0" fill="#0E1018" stroke="#1E2233" stroke-width="1"/>
  <circle cx="-56" cy="181" r="5" fill="#22D3EE"/>
  <rect x="-64" y="192" width="16" height="3" rx="1.5" fill="#22D3EE"/>
  <circle cx="0" cy="181" r="5" fill="#3A3F55"/>
  <rect x="-8" y="192" width="16" height="3" rx="1.5" fill="#3A3F55"/>
  <circle cx="56" cy="181" r="5" fill="#3A3F55"/>
